<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>星火三部曲 · 分享卡片</title>
  <link rel="stylesheet" href="site.css">
  <style>
    html,body{width:1200px;height:630px;overflow:hidden;background:#070b18}
    body{
      position:relative;
      background:
        radial-gradient(760px 420px at 89% 4%,rgba(230,173,69,.2),transparent 65%),
        radial-gradient(620px 360px at 7% 105%,rgba(242,96,29,.17),transparent 68%),
        linear-gradient(128deg,#071025 0%,#0d1a38 52%,#111b2e 100%);
    }
    .share-card{
      position:relative;z-index:2;width:100%;height:100%;
      padding:54px 66px 48px;overflow:hidden;
      border:1px solid rgba(246,220,155,.28);
    }
    .share-card::before{
      content:"";position:absolute;inset:22px;pointer-events:none;
      border:1px solid rgba(246,220,155,.12);border-radius:24px;
    }
    .share-card::after{
      content:"";position:absolute;right:-150px;bottom:-270px;
      width:610px;height:610px;border:1px solid rgba(246,220,155,.14);
      border-radius:50%;box-shadow:
        0 0 0 70px rgba(246,220,155,.025),
        0 0 0 140px rgba(246,220,155,.018);
    }
    .brand{display:flex;align-items:center;gap:16px}
    .mark{
      width:56px;height:56px;border:1px solid rgba(246,220,155,.35);border-radius:17px;
      display:grid;place-items:center;
      background:linear-gradient(155deg,rgba(246,220,155,.16),rgba(242,96,29,.18));
      box-shadow:0 10px 30px rgba(242,96,29,.15);
    }
    .mark svg{width:32px;height:32px}
    .brand-copy{display:grid;gap:4px}
    .brand-copy strong{
      color:#f6dc9b;font-family:"SimSun",serif;font-size:18px;letter-spacing:.18em;font-weight:600;
    }
    .brand-copy span{
      color:#c98a2b;font-family:Consolas,monospace;font-size:12px;letter-spacing:.18em;
    }
    .main{
      position:absolute;left:68px;top:162px;width:640px;
    }
    .eyebrow{
      color:#e6ad45;font-family:"SimSun",serif;font-size:16px;letter-spacing:.42em;
    }
    h1{
      margin-top:22px;color:transparent;font-family:"SimSun",serif;
      font-size:82px;line-height:1;font-weight:700;letter-spacing:.1em;
      background:linear-gradient(180deg,#fff0c3 5%,#f6dc9b 42%,#d4922e 94%);
      -webkit-background-clip:text;background-clip:text;
      filter:drop-shadow(0 8px 22px rgba(230,173,69,.16));
    }
    .poem{
      margin-top:25px;color:#f6dc9b;font-family:"SimSun",serif;
      font-size:24px;line-height:1.65;letter-spacing:.11em;
    }
    .promise{
      margin-top:20px;color:#aebdda;font-size:17px;line-height:1.8;letter-spacing:.05em;
    }
    .bottom{
      position:absolute;left:68px;bottom:47px;
      display:flex;align-items:center;gap:16px;color:#9fb2d8;
      font-family:Consolas,monospace;font-size:13px;letter-spacing:.12em;
    }
    .bottom i{width:38px;height:1px;background:#c98a2b;box-shadow:0 0 10px rgba(230,173,69,.5)}
    .chapters{
      position:absolute;right:66px;top:155px;width:366px;
      padding-left:28px;border-left:1px solid rgba(246,220,155,.24);
    }
    .chapters::before{
      content:"";position:absolute;left:-2px;top:0;width:3px;height:94px;
      background:linear-gradient(180deg,#f2601d,rgba(230,173,69,.1));
      box-shadow:0 0 13px rgba(242,96,29,.45);
    }
    .chapter{
      position:relative;display:grid;grid-template-columns:52px 1fr;column-gap:14px;
      min-height:118px;padding-top:2px;
    }
    .chapter .num{
      color:#c98a2b;font-family:"SimSun",serif;font-size:25px;letter-spacing:.08em;
    }
    .chapter .copy{display:grid;align-content:start;gap:7px}
    .chapter h2{
      color:#f6dc9b;font-family:"SimSun",serif;font-size:24px;letter-spacing:.09em;font-weight:600;
    }
    .chapter p{color:#92a6ce;font-size:13px;line-height:1.65;letter-spacing:.04em}
    .chapter + .chapter{border-top:1px solid rgba(246,220,155,.12);padding-top:26px}
    .stars-hint{
      position:absolute;right:69px;bottom:48px;color:#c98a2b;
      font-family:"SimSun",serif;font-size:15px;letter-spacing:.32em;
    }
  </style>
</head>
<body>
  <div class="starfield" id="starfield" aria-hidden="true">
    <div class="starfield__layer"></div>
    <div class="starfield__layer"></div>
    <div class="starfield__layer"></div>
  </div>

  <main class="share-card">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f6dc9b" stroke-width="1.5" stroke-linejoin="round">
          <path d="M19 13.2A7.5 7.5 0 1 1 10.8 5a6 6 0 0 0 8.2 8.2z" fill="rgba(246,220,155,.18)"/>
          <path d="M8.2 11.2l1.3 3.4 3.4 1.3-3.4 1.3-1.3 3.4-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#f2601d" stroke="none"/>
        </svg>
      </div>
      <div class="brand-copy">
        <strong>星火三部曲</strong>
        <span>ESTY · STARFIRE SERIES</span>
      </div>
    </div>

    <section class="main">
      <div class="eyebrow">写给未来的三封信</div>
      <h1>星星之火<br>可以燎原</h1>
      <p class="poem">东风夜放花千树，更吹落，星如雨。</p>
      <p class="promise">从一份牵挂，到一段专注，再到更远的远方。</p>
    </section>

    <aside class="chapters" aria-label="三部曲章节">
      <div class="chapter">
        <div class="num">壹</div>
        <div class="copy">
          <h2>星火续火花</h2>
          <p>云端守护牵挂，让每天一句问候都有了归处。</p>
        </div>
      </div>
      <div class="chapter">
        <div class="num">贰</div>
        <div class="copy">
          <h2>星火专注 Pro</h2>
          <p>跨过开始阻力，把每一次心无旁骛连成星链。</p>
        </div>
      </div>
      <div class="chapter">
        <div class="num">叁</div>
        <div class="copy">
          <h2>远方 · 待定</h2>
          <p>火种已经埋下，下一簇光仍在路上。</p>
        </div>
      </div>
    </aside>

    <div class="bottom"><i></i><span>STARFIRE TRILOGY · 2026</span></div>
    <div class="stars-hint">小火慢燃，终至燎原</div>
  </main>
  <script src="site.js"></script>
</body>
</html>
