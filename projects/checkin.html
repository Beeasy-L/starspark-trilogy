<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), cam = $("cam"), fx = $("fx");
  var loading = $("loading"), loadText = $("load-text");
  var hint = $("hint"), startBtn = $("start-btn"), snapBtn = $("snap-btn");
  var cardWrap = $("card-wrap"), cardImg = $("card-img"), countLine = $("count-line"), dlBtn = $("dl-btn"), againBtn = $("again-btn");

  var KEY = "starfire-checkin-count";
  var count = parseInt(localStorage.getItem(KEY) || "0", 10);

  var stream = null, landmarker = null, running = false;
  var bloomFrames = 0, fired = false;

  // Three.js 粒子花状态
  var FLOWER = { x: 0, y: 0, spread: 0, spin: 0, burst: 0 };
  var flower3D = null;

  function setHint(txt, hit){
    hint.hidden = false;
    hint.textContent = txt;
    hint.classList.toggle("hit", !!hit);
  }
  function hideHint(){ hint.hidden = true; }

  // 镜像坐标（与预览一致：视频与画布都 scaleX(-1)）
  function flipLandmarks(lm){
    var out = [];
    for(var i = 0; i < lm.length; i++) out.push({ x: 1 - lm[i].x, y: lm[i].y });
    return out;
  }

  // 食指(8)+中指(12)张合度 → 0~1（并拢≈0，张开≈1）
  function fingerGap(lm){
    if(!lm) return 0;
    var dx = lm[8].x - lm[12].x, dy = lm[8].y - lm[12].y;
    var d = Math.sqrt(dx * dx + dy * dy);
    return Math.max(0, Math.min(1, (d - 0.025) / 0.10));
  }

  // ---------- Three.js 3D 粒子莲花 ----------
  var THREE_URLS = [
    "https://cdn.npmmirror.com/packages/three/0.163.0/files/build/three.module.min.js",
    "https://cdn.npmmirror.com/packages/three/0.163.0/files/build/three.module.js"
  ];
  var THREE_READY = null;
  function loadThree(){
    if(THREE_READY) return THREE_READY;
    THREE_READY = import(THREE_URLS[0]).catch(function(){ return import(THREE_URLS[1]); });
    return THREE_READY;
  }

  function makeSpriteTexture(THREE){
    var cv = document.createElement("canvas");
    cv.width = cv.height = 64;
    var g = cv.getContext("2d");
    var grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, "rgba(255,255,255,1)");
    grd.addColorStop(0.35, "rgba(255,255,255,.55)");
    grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(cv);
  }

  // 花瓣叶形包络（根窄→中宽→尖收）
  function petalW(u){
    return Math.pow(Math.sin(Math.PI * u), 0.55) * (0.22 + 0.78 * u);
  }

  // 建一层粒子 Points，items: {phi,u,v,ph,r,g,b}
  function makeLayer(THREE, items, size, renderOrder){
    var count = items.length;
    var pos = new Float32Array(count * 3);
    var col = new Float32Array(count * 3);
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    var mat = new THREE.PointsMaterial({
      size: size,
      map: makeSpriteTexture(THREE),
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });
    var pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    pts.renderOrder = renderOrder;
    return { pts: pts, items: items, pos: pos, col: col, count: count, order: new Array(count) };
  }

  // 创建 3D 粒子莲花（闭合花苞 ⇄ 绽放莲花，绕轴自旋，跟随手势微倾）
  function createFlower3D(THREE, canvas){
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: false, powerPreference: "high-performance" });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 20);
    camera.position.set(0, 1.15, 3.1);
    camera.lookAt(0, 0, 0);
    var group = new THREE.Group();
    scene.add(group);

    var layers = [];
    var cores = [], dust = [], burstItems = [];
    var i, j, k, li;
    // 四层花瓣，由外到内：琥珀金 → 金橙 → 粉 → 紫罗兰，逐层错位、逐层更亮更小更竖
    var layerDefs = [
      { petals: 8, gu: 6, gv: 6, scale: 1.00, off: 0.000,    delay: 0.00, thMul: 0.95, base: [0.86, 0.56, 0.24], jit: [0.12, 0.16, 0.14] },
      { petals: 8, gu: 5, gv: 5, scale: 0.82, off: 0.19635, delay: 0.14, thMul: 1.00, base: [0.97, 0.74, 0.42], jit: [0.03, 0.14, 0.18] },
      { petals: 8, gu: 5, gv: 5, scale: 0.65, off: 0.39270, delay: 0.28, thMul: 1.06, base: [0.93, 0.64, 0.80], jit: [0.05, 0.13, 0.20] },
      { petals: 8, gu: 4, gv: 4, scale: 0.49, off: 0.58905, delay: 0.42, thMul: 1.12, base: [0.86, 0.68, 0.96], jit: [0.10, 0.20, 0.04] }
    ];
    for(li = 0; li < layerDefs.length; li++){
      var def = layerDefs[li], items = [];
      for(i = 0; i < def.petals; i++){
        for(j = 0; j < def.gu; j++){
          for(k = 0; k < def.gv; k++){
            items.push({
              phi: (i / def.petals) * Math.PI * 2 + def.off + (Math.random() - 0.5) * 0.20,
              u: 0.13 + (j + Math.random() * 0.7) / def.gu * 0.85,
              v: ((k + Math.random() * 0.6) / def.gv * 2 - 1) * 0.80,
              ph: 0,
              r: def.base[0] + def.jit[0] * Math.random(),
              g: def.base[1] + def.jit[1] * Math.random(),
              b: def.base[2] + def.jit[2] * Math.random(),
              scale: def.scale, delay: def.delay, thMul: def.thMul
            });
          }
        }
      }
      layers.push(makeLayer(THREE, items, 0.052 - li * 0.004, li + 1));
    }
    // 花蕊：竖直小粒子（暖金）
    for(i = 0; i < 36; i++){
      cores.push({ phi: Math.random() * Math.PI * 2, u: 0.05 + Math.random() * 0.13, v: (Math.random() * 2 - 1) * 0.28, ph: 0, r: 1, g: 0.98, b: 0.86 });
    }
    // 环绕光尘：蓝紫双色点缀
    for(i = 0; i < 56; i++){
      var purple = Math.random() < 0.5;
      dust.push({ phi: Math.random() * Math.PI * 2, u: 0.75 + Math.random() * 1.0, v: (Math.random() * 2 - 1) * 0.45, ph: Math.random() * Math.PI * 2, r: purple ? 0.72 : 0.62, g: purple ? 0.66 : 0.84, b: purple ? 1.0 : 0.98 });
    }
    // 绽放光尘（预分配 72，按 life 管理）
    for(i = 0; i < 72; i++){
      burstItems.push({ life: 0, decay: 0.04, vx: 0, vy: 0, vz: 0, r: 1, g: 0.85, b: 0.6 });
    }
    layers.push(makeLayer(THREE, cores, 0.032, 5));
    layers.push(makeLayer(THREE, dust, 0.040, 6));
    for(i = 0; i < layers.length; i++) group.add(layers[i].pts);
    var burstLayer = makeLayer(THREE, burstItems, 0.045, 7);
    burstLayer.pts.visible = false;
    group.add(burstLayer.pts);

    var burstOn = false;

    function update(bloom, midX, midY, triggerBurst){
      var s = Math.max(0, Math.min(1, bloom));
      // 花朵位置与微倾斜跟随手指（轻微交互感）
      group.position.x += ((midX - 0.5) * 1.7 - group.position.x) * 0.14;
      group.position.y += ((0.5 - midY) * 1.2 - group.position.y) * 0.14;
      group.rotation.z += (-(midX - 0.5) * 0.30 - group.rotation.z) * 0.10;
      group.rotation.x += ((0.5 - midY) * 0.22 - group.rotation.x) * 0.10;
      group.rotation.y += 0.012 + s * 0.022;

      // 每层独立 bloom：由外到内一层层开（delay 越大开得越晚），闭合时反向逐层收
      var L, th, r, w, phi, px, py, pz, cph, sph, st, cth;
      for(L = 0; L < 6; L++){
        var layer = layers[L], items = layer.items, pos = layer.pos, col = layer.col, order = layer.order;
        for(i = 0; i < layer.count; i++){
          var p = items[i];
          if(L === 5){ // 光尘：环绕公转
            var dr = 1.18 + 0.35 * s + Math.sin(group.rotation.y * 2 + p.ph) * 0.16;
            phi = p.phi + group.rotation.y * 0.8;
            px = Math.cos(phi) * dr;
            pz = Math.sin(phi) * dr * 0.72;
            py = 0.10 + Math.sin(group.rotation.y * 1.6 + p.ph) * 0.20;
          } else if(L === 4){ // 花蕊：始终竖直
            phi = p.phi;
            cph = Math.cos(phi); sph = Math.sin(phi);
            px = cph * p.u - sph * p.v * 0.18;
            pz = sph * p.u + cph * p.v * 0.18;
            py = 0.06 + p.u * 0.5;
          } else { // 花瓣层：本层绽放度 = clamp((s - delay)/0.22)
            var bl = Math.max(0, Math.min(1, (s - p.delay) / 0.22));
            th = (0.10 + 1.32 * bl) * p.thMul;   // 闭合≈竖直花苞，绽放≈水平莲花
            r = p.u * p.scale;                   // 层半径：外层大、内层小
            w = p.v * petalW(p.u) * 0.46 * (0.5 + 0.5 * bl) * p.scale;
            phi = p.phi + group.rotation.y;
            cph = Math.cos(phi); sph = Math.sin(phi);
            st = Math.sin(th); cth = Math.cos(th);
            px = cph * r * st - sph * w;
            pz = sph * r * st + cph * w;
            py = r * cth;
          }
          pos[i * 3] = px; pos[i * 3 + 1] = py; pos[i * 3 + 2] = pz;
          if(L < 4){ // 绽放时花瓣微微点亮
            var fade = 0.90 + 0.10 * Math.max(0, Math.min(1, (s - p.delay) / 0.22));
            col[i * 3] = p.r * fade; col[i * 3 + 1] = p.g * fade; col[i * 3 + 2] = p.b * fade;
          } else {
            col[i * 3] = p.r; col[i * 3 + 1] = p.g; col[i * 3 + 2] = p.b;
          }
          order[i] = i;
        }
        // 层内按 z 深度从远到近重排（近的盖住远的，立体遮挡）
        order.sort(function(a, b){ return pos[a * 3 + 2] - pos[b * 3 + 2]; });
        var np = new Float32Array(pos), nc = new Float32Array(col);
        for(i = 0; i < layer.count; i++){
          var si = order[i];
          np[i * 3] = pos[si * 3]; np[i * 3 + 1] = pos[si * 3 + 1]; np[i * 3 + 2] = pos[si * 3 + 2];
          nc[i * 3] = col[si * 3]; nc[i * 3 + 1] = col[si * 3 + 1]; nc[i * 3 + 2] = col[si * 3 + 2];
        }
        layer.pos.set(np); layer.col.set(nc);
        layer.pts.geometry.attributes.position.needsUpdate = true;
        layer.pts.geometry.attributes.color.needsUpdate = true;
      }
      // 绽放瞬间：光尘向外飘散
      if(triggerBurst && !burstOn){
        burstOn = true;
        burstLayer.pts.visible = true;
        var bi = burstLayer.items;
        for(i = 0; i < bi.length; i++){
          var ang = Math.random() * Math.PI * 2;
          var el = Math.PI / 2 * (0.45 + Math.random() * 0.5);
          bi[i].vx = Math.cos(ang) * Math.sin(el);
          bi[i].vz = Math.sin(ang) * Math.sin(el);
          bi[i].vy = Math.cos(el);
          bi[i].life = 1;
          bi[i].decay = 0.035 + Math.random() * 0.03;
          bi[i].r = 1; bi[i].g = 0.75 + Math.random() * 0.2; bi[i].b = 0.55 + Math.random() * 0.35;
        }
      }
      if(burstOn){
        var bp = burstLayer.pos, bc = burstLayer.col, alive = false;
        for(i = 0; i < burstLayer.count; i++){
          var b = burstLayer.items[i];
          b.life -= b.decay;
          if(b.life <= 0){ bp[i * 3] = 999; bp[i * 3 + 1] = 999; bp[i * 3 + 2] = 999; bc[i * 3] = 0; bc[i * 3 + 1] = 0; bc[i * 3 + 2] = 0; continue; }
          alive = true;
          var d = (1 - b.life) * 1.5;
          bp[i * 3] = b.vx * d; bp[i * 3 + 1] = b.vy * d * 1.05 + 0.12; bp[i * 3 + 2] = b.vz * d;
          bc[i * 3] = b.r * b.life; bc[i * 3 + 1] = b.g * b.life; bc[i * 3 + 2] = b.b * b.life;
        }
        burstLayer.pts.geometry.attributes.position.needsUpdate = true;
        burstLayer.pts.geometry.attributes.color.needsUpdate = true;
        if(!alive){ burstOn = false; burstLayer.pts.visible = false; }
      }
    }

    function render(){
      renderer.render(scene, camera);
    }
    function resize(w, h){
      if(w > 0 && h > 0){
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    }
    function dispose(){
      scene.traverse(function(o){
        if(o.geometry) o.geometry.dispose();
        if(o.material){
          if(o.material.map) o.material.map.dispose();
          o.material.dispose();
        }
      });
      renderer.dispose();
    }
    resize(canvas.clientWidth || 560, canvas.clientHeight || 420);
    return { update: update, render: render, resize: resize, dispose: dispose };
  }




  // ---------- 打卡图合成 ----------
  function composeCard(){
    var W = 1200, H = 630;
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var c = cv.getContext("2d");

    // 背景：深蓝星空渐变
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b1026");
    g.addColorStop(0.55, "#0a0f1e");
    g.addColorStop(1, "#141a38");
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    // 星点
    var seed = 12345;
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for(var i = 0; i < 160; i++){
      var sx = rnd() * W, sy = rnd() * H, sr = 0.6 + rnd() * 1.6;
      c.globalAlpha = 0.25 + rnd() * 0.55;
      c.fillStyle = rnd() < 0.18 ? "#f2c66d" : "#dce4f5";
      c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;

    // 左侧照片：取当前摄像头画面，裁成竖版放左区；无画面时画占位星夜
    var pad = 26, pw = 430, ph = H - pad * 2;
    var shot = document.createElement("canvas");
    var sw = cam.videoWidth || 0, sh = cam.videoHeight || 0;
    shot.width = sw || 640; shot.height = sh || 480;
    var sc = shot.getContext("2d");
    var hasFrame = sw > 0 && cam.readyState >= 2;
    if(hasFrame){
      sc.translate(shot.width, 0); sc.scale(-1, 1);  // 镜像，与预览一致
      sc.drawImage(cam, 0, 0, shot.width, shot.height);
    } else {
      var bg = sc.createLinearGradient(0, 0, 0, shot.height);
      bg.addColorStop(0, "#0b1026"); bg.addColorStop(1, "#141a38");
      sc.fillStyle = bg; sc.fillRect(0, 0, shot.width, shot.height);
      sc.fillStyle = "rgba(246,220,155,.8)";
      sc.font = 'bold 64px "STZhongsong","Songti SC","SimSun",serif';
      sc.textAlign = "center";
      sc.fillText("星火", shot.width / 2, shot.height / 2);
    }
    c.save();
    c.beginPath();
    c.roundRect(pad, pad, pw, ph, 16);
    c.clip();
    if(hasFrame){
      // 裁中心竖版区域
      var cropH = sw * (ph / pw) > sh ? sh : sw * (ph / pw);
      var cropY = (sh - cropH) / 2;
      c.drawImage(shot, 0, cropY, sw, cropH, pad, pad, pw, ph);
    } else {
      c.drawImage(shot, 0, 0, shot.width, shot.height, pad, pad, pw, ph);
    }
    c.restore();
    c.strokeStyle = "rgba(246,220,155,.55)";
    c.lineWidth = 2;
    c.beginPath(); c.roundRect(pad, pad, pw, ph, 16); c.stroke();

    // 右侧文字
    var x0 = pad + pw + 40, tw = W - x0 - 40;
    c.fillStyle = "#f6dc9b";
    c.font = 'bold 58px "STZhongsong","Songti SC","SimSun",serif';
    c.textAlign = "left"; c.textBaseline = "alphabetic";
    c.fillText("星火三部曲", x0, 170);
    // 细金线
    c.strokeStyle = "rgba(242,198,109,.55)";
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(x0, 198); c.lineTo(x0 + tw * 0.55, 198); c.stroke();
    c.fillStyle = "#e8d9ae";
    c.font = '30px "STZhongsong","Songti SC","SimSun",serif';
    c.fillText("心栖明月长明", x0, 252);

    // 日期与第 N 次
    c.fillStyle = "rgba(232,217,174,.85)";
    c.font = '20px "STZhongsong","Songti SC","SimSun",serif';
    var now = new Date();
    var pad2 = function(n){ return (n < 10 ? "0" : "") + n; };
    var dateStr = now.getFullYear() + "." + pad2(now.getMonth() + 1) + "." + pad2(now.getDate());
    c.fillText(dateStr + " · 第 " + count + " 次星火打卡", x0, 320);

    // 底部小字
    c.fillStyle = "rgba(220,228,245,.6)";
    c.font = '16px "STZhongsong","Songti SC","SimSun",serif';
    c.fillText("Starfire Series · 2026 · Made with moonlight", x0, H - 60);

    return cv.toDataURL("image/png");
  }

  function showCard(dataUrl){
    cardImg.src = dataUrl;
    dlBtn.href = dataUrl;
    cardWrap.hidden = false;
    countLine.textContent = "这是你第 " + count + " 次点亮星火";
    cardWrap.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function fireCheckin(){
    setHint("花开啦 ✌", true);
    setTimeout(function(){
      count++;
      localStorage.setItem(KEY, String(count));
      var dataUrl = composeCard();
      showCard(dataUrl);
      running = false;
      stopCam();
      hideHint();
    }, 1100);
  }

  // ---------- 手势检测循环 ----------
  var lastLandmarks = null, rafId = null, frameSkip = 0;
  var midX = 0.5, midY = 0.5;
  function loop(ts){
    if(!running) return;
    rafId = requestAnimationFrame(loop);
    if(frameSkip % 3 !== 0){ frameSkip++; return; }
    frameSkip++;
    if(!landmarker || cam.readyState < 2){
      if(flower3D) flower3D.render();
      return;
    }
    var res;
    try { res = landmarker.detectForVideo(cam, performance.now()); }
    catch(e){ return; }
    var lm = null;
    if(res && res.landmarks && res.landmarks.length > 0){
      lastLandmarks = res.landmarks[0];
      lm = flipLandmarks(lastLandmarks);
    }
    if(lm){
      var gap = fingerGap(lm);
      FLOWER.spread += (gap - FLOWER.spread) * 0.22;
      midX += (((lm[8].x + lm[12].x) / 2) - midX) * 0.28;
      midY += (((lm[8].y + lm[12].y) / 2) - midY) * 0.28;
      if(FLOWER.spread > 0.88){
        bloomFrames++;
        if(bloomFrames > 46 && !fired){
          fired = true;
          FLOWER.burst = 1;
          fireCheckin();
        } else if(!fired){
          setHint("要开了…两指再张开一点");
        }
      } else {
        bloomFrames = 0;
        setHint("两指张开，花开；并拢，花合");
      }
    } else {
      bloomFrames = 0;
      FLOWER.spread *= 0.97;
      setHint("食指和中指张开一点，让花醒来");
    }
    if(flower3D){
      var bf = FLOWER.burst > 0;
      if(bf) FLOWER.burst = 0;
      flower3D.update(FLOWER.spread, midX, midY, bf);
      flower3D.render();
    }
  }

  function startCam(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      loadText.textContent = "当前浏览器不支持摄像头";
      return;
    }
    loadText.textContent = "正在请求摄像头，请在弹窗里点「允许」…";
    var pending = true;
    var guard = setTimeout(function(){
      if(pending){
        pending = false;
        loadText.textContent = "摄像头没有响应（用 file:// 本地打开时权限常被拦截）——点「直接拍照」也能打卡";
        snapBtn.disabled = false;
      }
    }, 8000);
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then(function(s){
        clearTimeout(guard);
        if(!pending) return s;
        pending = false;
        stream = s;
        cam.srcObject = s;
        loading.hidden = true;
        startBtn.disabled = true;
        snapBtn.disabled = false;
        setHint("正在加载手势模型…");
        return s;
      })
      .then(loadModel)
      .catch(function(err){
        clearTimeout(guard);
        pending = false;
        loadText.textContent = "摄像头被拒绝或不可用——点「直接拍照」也能打卡";
        snapBtn.disabled = false;
      });
  }

  // ---------- 手势模型（双源：抖音 CDN 模型脚本为主，GitHub raw 直链兜底；JS 库与 wasm 走 npmmirror） ----------
  var MP_JS = "https://cdn.npmmirror.com/packages/%40mediapipe%2ftasks-vision/0.10.14/files/vision_bundle.mjs";
  var MP_WASM = "https://cdn.npmmirror.com/packages/%40mediapipe%2ftasks-vision/0.10.14/files/wasm";
  var MP_MODEL_JS = "https://aka.doubaocdn.com/s/FVBGBjs3oy";
  var MP_MODEL_RAW = "https://raw.githubusercontent.com/IoT-gamer/hand_landmarker/main/android/src/main/assets/hand_landmarker.task";

  function modelBytes(){
    var b64 = window.__STARFIRE_MODEL_B64 || "";
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function loadModel(){
    loadText.textContent = "正在加载手势模型（首次约 8MB，请稍候）…";
    var done = false;
    var guard = setTimeout(function(){
      if(!done){
        loadText.textContent = "模型加载超时，请检查网络后刷新（或点「直接拍照」）";
        snapBtn.disabled = false;
      }
    }, 90000);

    var onOk = function(hl){
      clearTimeout(guard); done = true;
      landmarker = hl;
      bloomFrames = 0; fired = false;
      FLOWER.spread = 0; FLOWER.burst = 0; FLOWER.spin = 0;
      midX = 0.5; midY = 0.5;
      setHint("正在点亮 3D 渲染引擎…");
      loadThree().then(function(THREE){
        if(flower3D){ try { flower3D.dispose(); } catch(e){} flower3D = null; }
        try {
          flower3D = createFlower3D(THREE, fx);
          flower3D.resize(stage.clientWidth, stage.clientHeight);
        } catch(err){
          flower3D = null;
          loadText.textContent = "3D 渲染初始化失败（浏览器可能不支持 WebGL），点「直接拍照」也能打卡";
          snapBtn.disabled = false;
          return;
        }
        running = true;
        setHint("张开食指和中指，让花醒来");
        requestAnimationFrame(loop);
      }).catch(function(){
        loadText.textContent = "3D 渲染库加载失败，请检查网络后刷新（或点「直接拍照」）";
        snapBtn.disabled = false;
      });
    };
    var onErr = function(e){
      clearTimeout(guard); done = true;
      loadText.textContent = "模型加载失败，请检查网络后刷新（或点「直接拍照」）";
      snapBtn.disabled = false;
    };

    // 方式 B：npmmirror 库 + raw 直链模型（兜底）
    var startWithRaw = function(){
      import(MP_JS)
        .then(function(mod){
          return mod.FilesetResolver.forVisionTasks(MP_WASM).then(function(fileset){
            return mod.HandLandmarker.createFromOptions(fileset, {
              baseOptions: { modelAssetPath: MP_MODEL_RAW, delegate: "CPU" },
              runningMode: "VIDEO",
              numHands: 1
            });
          });
        })
        .then(onOk)
        .catch(onErr);
    };

    // 方式 A：doubaocdn 模型脚本 → base64 解码 → modelAssetBuffer
    var s = document.createElement("script");
    s.src = MP_MODEL_JS;   // 注意：不加 crossOrigin（no-cors 请求不带 Origin）
    s.onload = function(){
      if(window.__STARFIRE_MODEL_B64 && window.__STARFIRE_MODEL_B64.length > 1000){
        import(MP_JS)
          .then(function(mod){
            return mod.FilesetResolver.forVisionTasks(MP_WASM).then(function(fileset){
              return mod.HandLandmarker.createFromOptions(fileset, {
                baseOptions: { modelAssetBuffer: modelBytes(), delegate: "CPU" },
                runningMode: "VIDEO",
                numHands: 1
              });
            });
          })
          .then(onOk)
          .catch(onErr);
      } else {
        startWithRaw();
      }
    };
    s.onerror = function(){ startWithRaw(); };
    document.head.appendChild(s);
  }

  function stopCam(){
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    running = false;
    startBtn.disabled = false;
    snapBtn.disabled = true;
  }

  // 手动拍照兜底
  snapBtn.addEventListener("click", function(){
    if(cam.readyState >= 2 && running){
      count++;
      localStorage.setItem(KEY, String(count));
      var dataUrl = composeCard();
      showCard(dataUrl);
      stopCam();
    } else {
      // 摄像头没起来：生成无照片版打卡图
      count++;
      localStorage.setItem(KEY, String(count));
      var dataUrl = composeCard();
      showCard(dataUrl);
      stopCam();
    }
  });

  againBtn.addEventListener("click", function(){
    cardWrap.hidden = true;
    running = false;
    stopCam();
    if(flower3D){ try { flower3D.dispose(); } catch(e){} flower3D = null; }
    loading.hidden = false;
    loadText.textContent = "点击「开始打卡」，重新开启摄像头";
    startCam();
  });

  startBtn.addEventListener("click", startCam);
  // 返回时清理摄像头
  window.addEventListener("beforeunload", function(){
    stopCam();
    if(flower3D){ try { flower3D.dispose(); } catch(e){} flower3D = null; }
  });
})();
</script>
</body>
</html>
