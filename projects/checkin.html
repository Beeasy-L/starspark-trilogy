<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>指尖花 — Fingertip Bloom</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#010116;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;height:100dvh;width:100vw;user-select:none;-webkit-user-select:none}
canvas{display:block}
#left-panel{position:fixed;z-index:20;left:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;pointer-events:none}
#logo-dot{width:8px;height:8px;border-radius:50%;background:#C810FF;box-shadow:0 0 10px #C810FF,0 0 20px rgba(200,16,255,0.5)}
#logo-text{font-size:18px;font-weight:600;letter-spacing:.04em;background:linear-gradient(135deg,#E040FB,#7C4DFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#sub-logo{font-size:11px;color:rgba(255,255,255,0.24);letter-spacing:.14em;text-transform:uppercase;margin-top:-4px;margin-left:2px}
#openness-card{pointer-events:auto;display:flex;align-items:center;gap:10px;background:rgba(15,0,30,0.6);backdrop-filter:blur(16px)saturate(140%);-webkit-backdrop-filter:blur(16px)saturate(140%);border:1px solid rgba(200,16,255,0.14);border-radius:36px;padding:9px 18px;transition:all .5s}
#openness-card .icon-hand{font-size:16px;transition:transform .4s}
#openness-card.blooming .icon-hand{transform:scale(1.25)}
#openness-text{font-size:13px;color:rgba(255,255,255,0.8);letter-spacing:.04em}

#top-tag{position:fixed;z-index:20;right:28px;top:28px;pointer-events:auto;display:flex;align-items:center;gap:7px;background:rgba(15,0,30,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(200,16,255,0.12);border-radius:28px;padding:8px 18px;font-size:12px;letter-spacing:.05em;color:rgba(255,255,255,0.6);transition:all .5s}
#top-tag .red-dot{width:7px;height:7px;border-radius:50%;background:#FF1744;box-shadow:0 0 6px #FF1744;flex-shrink:0}

#hand-window{position:fixed;z-index:20;right:20px;bottom:20px;pointer-events:none;background:rgba(0,0,0,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
#hand-window-header{font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,0.35);text-transform:uppercase;padding:8px 12px 6px;background:rgba(255,255,255,0.03)}
#hand-canvas{display:block;width:200px;height:150px;transform:scaleX(-1)}
#hint-line{position:fixed;z-index:15;bottom:28px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.08em;color:rgba(255,255,255,0.22);transition:all .6s;pointer-events:none;text-align:center}
#hint-line.prompt{color:#FFD54F;font-size:15px;animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.7}to{opacity:1}}

#flash.on{opacity:.85;transition:opacity 0s}

#photo-stamp.show{opacity:1;transform:translate(-50%,-50%)scale(1.15)}
</style>
</head>
<body>
<div id="left-panel"><div id="logo-dot"></div><span id="logo-text">指尖花</span><div id="sub-logo">FINGERTIP BLOOM</div>
<div id="openness-card"><span class="icon-hand">✊</span><div><div id="openness-text">手掌舒展</div><div id="openness-pct">舒展度 50%</div></div></div>
<div id="layer-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
<div id="top-tag"><div class="red-dot"></div>握拳·闭合</div>
<div id="hand-window"><div id="hand-window-header">HAND TRACKING</div><canvas id="hand-canvas" width="200" height="150"></canvas></div>
<div id="hint-line">握拳 → 花苞 &nbsp;·&nbsp; 张开手掌 → 绽放 &nbsp;·&nbsp; 比✌ → 拍照打卡</div>
<div id="flash"></div><div id="photo-stamp">✦ 打卡成功 ✦</div>
<video id="webcam" autoplay playsinline style="display:none"></video>

<script type="importmap">{"imports":{"three":"https://cdn.npmmirror.com/packages/three/0.160.0/files/build/three.module.js"}}</script>
<script src="https://cdn.npmmirror.com/packages/@mediapipe/camera_utils/0.3.1675466862/files/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.npmmirror.com/packages/@mediapipe/hands/0.4.1675469240/files/hands.js" crossorigin="anonymous"></script>

<script type="module">
import * as THREE from 'three';

const videoEl=document.getElementById('webcam'),handCanvas=document.getElementById('hand-canvas'),handCtx=handCanvas.getContext('2d'),opennessPct=document.getElementById('openness-pct'),opennessCard=document.getElementById('openness-card'),topTag=document.getElementById('top-tag'),hintLine=document.getElementById('hint-line'),flash=document.getElementById('flash'),photoStamp=document.getElementById('photo-stamp'),layerDots=document.querySelectorAll('#layer-indicator .dot');

/* ═══════ RENDER ═══════ */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#010116');

const camera=new THREE.PerspectiveCamera(48,window.innerWidth/window.innerHeight,0.1,60);
camera.position.set(0,0,4.8);
camera.lookAt(0,0,0);

/* ═══════ STARFIELD — deep stars + twinkling ═══════ */
{
  const N=2000;
  const g=new THREE.BufferGeometry();
  const p=new Float32Array(N*3),c=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=4+Math.random()*16;
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(th);
    p[i*3+1]=r*Math.sin(ph)*Math.sin(th);
    p[i*3+2]=r*Math.cos(ph)-2;
    const t=Math.random();
    const col=new THREE.Color().setHSL(.58+Math.random()*.18,.15,.35+Math.random()*.65);
    c[i*3]=col.r;c[i*3+1]=col.g;c[i*3+2]=col.b;
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('color',new THREE.BufferAttribute(c,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.03,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false})));
}

// Twinkling stars
const twGeo=new THREE.BufferGeometry();
{
  const n=500,p=new Float32Array(n*3),s=new Float32Array(n);
  for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*18;p[i*3+1]=(Math.random()-.5)*14;p[i*3+2]=(Math.random()-.5)*10-2;s[i]=.02+Math.random()*.1;}
  twGeo.setAttribute('position',new THREE.BufferAttribute(p,3));
  twGeo.setAttribute('aSize',new THREE.BufferAttribute(s,1));
}
const twMat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0}},vertexShader:`attribute float aSize;varying float vS;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*(260./-mv.z);gl_Position=projectionMatrix*mv;vS=aSize;}`,fragmentShader:`varying float vS;uniform float uTime;void main(){float d=length(gl_PointCoord-.5);float tw=.4+.6*sin(gl_FragCoord.x*14.+uTime*1.8+vS*40.);gl_FragColor=vec4(vec3(.85,.9,1.),smoothstep(.5,.1,d)*tw);}`,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(twGeo,twMat));

/* ═══════ METEORS ═══════ */
const meteorGroup=new THREE.Group();
scene.add(meteorGroup);
const meteors=[];
for(let m=0;m<8;m++){
  const trailN=16;
  const pa=new Float32Array(trailN*3),ca=new Float32Array(trailN*3),sa=new Float32Array(trailN);
  for(let j=0;j<trailN;j++){ca[j*3]=1;ca[j*3+1]=1;ca[j*3+2]=1;sa[j]=.018;}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pa,3));
  g.setAttribute('color',new THREE.BufferAttribute(ca,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(sa,1));
  const mat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0}},vertexShader:`attribute float aSize;attribute vec3 color;varying vec3 vC;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*(220./-mv.z);gl_Position=projectionMatrix*mv;vC=color;}`,fragmentShader:`varying vec3 vC;void main(){float a=smoothstep(.5,.0,length(gl_PointCoord-.5));gl_FragColor=vec4(vC,a);}`,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(g,mat);
  meteorGroup.add(pts);
  meteors.push({
    g,pts,mat,trailN,
    progress:0,life:.8+Math.random()*2.2,
    ox:(Math.random()-.5)*8,oy:1.5+Math.random()*5,oz:(Math.random()-.5)*5-3,
    dx:(Math.random()-.5)*5,dy:-.8-Math.random()*1.5,dz:(Math.random()-.5)*3
  });
}

function updateMeteors(dt,time,hv,hp){
  for(const m of meteors){
    m.progress+=dt*(.7+.2*hv);
    const pr=m.progress/m.life;
    if(pr>1.||m.oy+m.dy*pr<-4.5){
      m.progress=0;m.life=.8+Math.random()*2.2;
      m.ox=(Math.random()-.5)*8;m.oy=1.5+Math.random()*5;m.oz=(Math.random()-.5)*5-3;
      m.dx=(Math.random()-.5)*5;m.dy=-.8-Math.random()*1.5;m.dz=(Math.random()-.5)*3;
    }
    const pa=m.g.attributes.position.array,ca=m.g.attributes.color.array;
    const ox=m.ox,oy=m.oy,oz=m.oz,dx=m.dx+hp.x*1.5,dy=m.dy,dz=m.dz+hp.y;
    for(let j=0;j<m.trailN;j++){
      const t=pr-j*.035;
      const idx=j*3;
      if(t<=0){
        pa[idx]=ox;pa[idx+1]=oy;pa[idx+2]=oz;
        ca[idx]=0;ca[idx+1]=0;ca[idx+2]=0;
      }else{
        pa[idx]=ox+dx*t;pa[idx+1]=oy+dy*t;pa[idx+2]=oz+dz*t;
        const fade=Math.max(0,Math.min(1,t/.2))*Math.max(0,Math.min(1,(m.life-m.progress)/.4));
        ca[idx]=.9*fade;ca[idx+1]=.9*fade;ca[idx+2]=fade;
      }
    }
    m.g.attributes.position.needsUpdate=true;
    m.g.attributes.color.needsUpdate=true;
    m.mat.uniforms.uTime.value=time;
  }
}

/* ═══════ PARTICLE SHADER ═══════ */
const roseVert=`attribute float aSize;attribute vec3 aColor;attribute float aAlpha;varying vec3 vC;varying float vA;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*(380./-mv.z);gl_Position=projectionMatrix*mv;vC=aColor;vA=aAlpha;}`;
const roseFrag=`varying vec3 vC;varying float vA;void main(){vec2 uv=gl_PointCoord-.5;float d=length(uv);float core=pow(1.-smoothstep(0.,.45,d)*.92,1.3);float glow=exp(-d*4.)*.35;float a=(core+glow)*vA;if(a<.002)discard;gl_FragColor=vec4(vC,a);}`;

/* ═══════ STEM ═══════ */
class Stem{
  constructor(){
    const n=400,pa=new Float32Array(n*3),ca=new Float32Array(n*3),sa=new Float32Array(n);
    for(let i=0;i<n;i++){
      const t=Math.random();
      pa[i*3]=(Math.random()-.5)*.03*(1+t*1.2);
      pa[i*3+1]=0-t*3.2;
      pa[i*3+2]=(Math.random()-.5)*.03*(1+t*1.2);
      const g=new THREE.Color().setHSL(.25+Math.random()*.08,.55,.12+Math.random()*.22);
      ca[i*3]=g.r;ca[i*3+1]=g.g;ca[i*3+2]=g.b;
      sa[i]=.012+Math.random()*.04;
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pa,3));
    g.setAttribute('color',new THREE.BufferAttribute(ca,3));
    g.setAttribute('aSize',new THREE.BufferAttribute(sa,1));
    this.obj=new THREE.Points(g,new THREE.ShaderMaterial({vertexShader:`attribute float aSize;attribute vec3 color;varying vec3 vC;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*(340./-mv.z);gl_Position=projectionMatrix*mv;vC=color;}`,fragmentShader:`varying vec3 vC;void main(){float a=smoothstep(.5,.1,length(gl_PointCoord-.5));gl_FragColor=vec4(vC,a);}`,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  }
  update(gb){this.obj.scale.setScalar(.85+gb*.18);}
}
const stem=new Stem();
scene.add(stem.obj);

/* ═══════ TRAIL ═══════ */
function mkRT(w,h){return new THREE.WebGLRenderTarget(w,h,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:THREE.HalfFloatType})}
let tRA=mkRT(window.innerWidth,window.innerHeight),tWB=mkRT(window.innerWidth,window.innerHeight);
const trG=new THREE.PlaneGeometry(2,2),trC=new THREE.OrthographicCamera(-1,1,1,-1,0,1),trS=new THREE.Scene();
const trM=new THREE.ShaderMaterial({uniforms:{tPrev:{value:null},uRet:{value:.93}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,fragmentShader:`varying vec2 vUv;uniform sampler2D tPrev;uniform float uRet;void main(){vec4 c=texture2D(tPrev,vUv);c.rgb*=uRet*vec3(.97,.93,1.03);gl_FragColor=c;}`,depthWrite:false,depthTest:false});
trS.add(new THREE.Mesh(trG,trM));
const cpMat=new THREE.MeshBasicMaterial({map:null,depthWrite:false,depthTest:false}),cpS=new THREE.Scene();
cpS.add(new THREE.Mesh(trG,cpMat));

function resizeRTs(){tRA.dispose();tWB.dispose();tRA=mkRT(window.innerWidth,window.innerHeight);tWB=mkRT(window.innerWidth,window.innerHeight);}

/* ═══════════════════════════════════════════════════════
   ROSE — compact teardrop petals, cream→pink→crimson
   ═══════════════════════════════════════════════════════ */
class Rose{
  constructor(){
    this.budPos=[];this.bloomPos=[];this.colors=[];this.sizes=[];this.alphas=[];this.layerIds=[];this.N=0;

    const cream    =new THREE.Color('#FFF8F0');
    const palePink =new THREE.Color('#FADAE0');
    const rosePink =new THREE.Color('#E890A0');
    const crimson  =new THREE.Color('#CC4040');
    const deepRed  =new THREE.Color('#8B1520');

    function petalColor(u,vAbs){
      let c;
      if(u<.10)c=cream.clone().lerp(palePink,u/.10);
      else if(u<.35)c=palePink.clone().lerp(rosePink,(u-.10)/.25);
      else if(u<.65)c=rosePink.clone().lerp(crimson,(u-.35)/.3);
      else c=crimson.clone().lerp(deepRed,(u-.65)/.35);
      if(vAbs>.55)c.lerp(new THREE.Color('#3A0A10'),(vAbs-.55)/.45);
      c.offsetHSL((Math.random()-.5)*.015,0,(Math.random()-.5)*.025);
      return c;
    }

    const layers=[
      {n:4,ro:.04, L:.60,w:.22,zd:.06,budR:.12,bs:0,  be:.22,ao:0},
      {n:5,ro:.12, L:.82,w:.32,zd:.09,budR:.14,bs:.06,be:.40,ao:.40},
      {n:6,ro:.22, L:1.05,w:.42,zd:.12,budR:.17,bs:.18,be:.58,ao:.22},
      {n:7,ro:.34, L:1.30,w:.52,zd:.15,budR:.20,bs:.36,be:.76,ao:.55},
    ];
    const ppPet=90;

    for(let li=0;li<layers.length;li++){
      const l=layers[li];
      for(let p=0;p<l.n;p++){
        const baseAngle=(p/l.n)*Math.PI*2+l.ao;
        for(let j=0;j<ppPet;j++){
          const u=j/ppPet;
          const r=l.ro+l.L*u;
          const wMul=Math.sin(u*Math.PI)*.9+.08*(1-u);
          const halfW=l.w*wMul;
          const vRaw=(Math.random()-.5)*2;
          const v=Math.sign(vRaw)*Math.pow(Math.abs(vRaw),.5);
          const lat=v*halfW;
          const a=baseAngle+lat/(r+.03);
          const x=r*Math.cos(a),y=r*Math.sin(a);
          const zBase=l.zd*(1-u)*Math.sin(u*Math.PI)*.5+Math.abs(v)*l.zd*(1-u*u)*.2;
          const backTilt=Math.max(0,Math.sin(baseAngle))*l.zd*2.5*u;
          this.bloomPos.push(new THREE.Vector3(x,y,zBase+backTilt));
          const phi=Math.random()*Math.PI,th=Math.random()*Math.PI*2,br=l.budR*Math.pow(Math.random(),1/2);
          this.budPos.push(new THREE.Vector3(br*Math.sin(phi)*Math.cos(th),br*Math.sin(phi)*Math.sin(th),br*Math.cos(phi)*.45));
          this.colors.push(petalColor(u,Math.abs(v)));
          this.sizes.push(.008+Math.random()*.032+u*.014);
          this.alphas.push(.25+Math.random()*.75+u*.06);
          this.layerIds.push(li);
          this.N++;
        }
      }
    }
    // Core
    for(let i=0;i<350;i++){
      const a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.7)*.12;
      this.budPos.push(new THREE.Vector3(0,0,0));
      this.bloomPos.push(new THREE.Vector3(Math.cos(a)*r,(Math.random()-.5)*.06,(Math.random()-.5)*.04+Math.sin(a)*r));
      this.colors.push(new THREE.Color().setHSL(.08+Math.random()*.05,.4,.45+Math.random()*.5));
      this.sizes.push(.008+Math.random()*.035);
      this.alphas.push(.45+Math.random()*.55);
      this.layerIds.push(-1);
      this.N++;
    }
    // Floaters
    for(let i=0;i<400;i++){
      const a=Math.random()*Math.PI*2,r=.15+Math.random()*1.8;
      const b=new THREE.Vector3(Math.cos(a)*r,(Math.random()-.5)*2.5,Math.sin(a)*r);
      this.budPos.push(b.clone().multiplyScalar(.08));
      this.bloomPos.push(b);
      this.colors.push(new THREE.Color().setHSL(.06+Math.random()*.06,.25,.3+Math.random()*.6));
      this.sizes.push(.003+Math.random()*.012);
      this.alphas.push(.03+Math.random()*.4);
      this.layerIds.push(-2);
      this.N++;
    }

    const pa=new Float32Array(this.N*3),ca=new Float32Array(this.N*3),sa=new Float32Array(this.N),aa=new Float32Array(this.N);
    for(let i=0;i<this.N;i++){
      const bb=this.budPos[i];pa[i*3]=bb.x;pa[i*3+1]=bb.y;pa[i*3+2]=bb.z;
      ca[i*3]=this.colors[i].r;ca[i*3+1]=this.colors[i].g;ca[i*3+2]=this.colors[i].b;
      sa[i]=this.sizes[i];aa[i]=this.alphas[i];
    }
    this.geo=new THREE.BufferGeometry();
    this.geo.setAttribute('position',new THREE.BufferAttribute(pa,3));
    this.geo.setAttribute('aColor',new THREE.BufferAttribute(ca,3));
    this.geo.setAttribute('aSize',new THREE.BufferAttribute(sa,1));
    this.geo.setAttribute('aAlpha',new THREE.BufferAttribute(aa,1));

    this.mat=new THREE.ShaderMaterial({vertexShader:roseVert,fragmentShader:roseFrag,uniforms:{uTime:{value:0}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
    this.pts=new THREE.Points(this.geo,this.mat);
    this.wp=new Float32Array(this.N);
    for(let i=0;i<this.N;i++)this.wp[i]=Math.random()*Math.PI*2;
  }

  update(gb,hp,hv,dt,time){
    const pa=this.geo.attributes.position.array;
    const ld=[{bs:0,be:.22},{bs:.06,be:.40},{bs:.18,be:.58},{bs:.36,be:.76}];
    const gbp=Math.pow(Math.min(gb,1),1.5);

    for(let i=0;i<this.N;i++){
      const li=this.layerIds[i],bu=this.budPos[i],bl=this.bloomPos[i];
      let e;
      if(li>=0&&li<ld.length){
        const p=Math.max(0,Math.min(1,(gb-ld[li].bs)/(ld[li].be-ld[li].bs+.001)));
        e=p*p*(3-2*p);
      }else e=gbp;
      let bx=bu.x+(bl.x-bu.x)*e,by=bu.y+(bl.y-bu.y)*e,bz=bu.z+(bl.z-bu.z)*e;
      const wa=.002+e*.012;
      bx+=Math.sin(time*1.8+this.wp[i])*wa*3;
      by+=Math.cos(time*2.1+this.wp[i])*wa*3;
      bz+=Math.cos(time*1.6+this.wp[i])*wa*1.2;
      if(li===-2&&hv>.01){const d=Math.sqrt(bx*bx+by*by+bz*bz)+.3;bx+=bx*Math.min(hv*2/d,.5)*.012;by+=by*Math.min(hv*1.5/d,.5)*.008;}
      pa[i*3]=bx;pa[i*3+1]=by;pa[i*3+2]=bz;
    }
    this.geo.attributes.position.needsUpdate=true;
    const aa=this.geo.attributes.aAlpha.array;
    for(let i=0;i<this.N;i++){
      if(this.layerIds[i]===-2)aa[i]=this.alphas[i]*(.08+gbp*.92);
      else if(this.layerIds[i]===-1)aa[i]=this.alphas[i]*(.12+gbp*.88);
      else aa[i]=this.alphas[i];
    }
    this.geo.attributes.aAlpha.needsUpdate=true;
    this.pts.position.x+=(hp.x*.2-this.pts.position.x)*.04;
    this.pts.position.y+=(hp.y*.18-this.pts.position.y)*.04;
    this.mat.uniforms.uTime.value=time;
  }
  getObj(){return this.pts;}
  activeLayers(gb){
    const a=[],ld=[{bs:0},{bs:.06},{bs:.18},{bs:.36}];
    for(const l of ld)a.push(gb>l.bs+.01);
    return a;
  }
}

/* ═══════ GESTURE ═══════ */
const FT=[4,8,12,16,20],PR=[0,5,17];
const HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
const handData={landmarks:null,detected:false,targetOpen:.5,palmX:.5,palmY:.5,velocity:0,prevPalmX:.5,prevPalmY:.5,isPeace:false};

function isPeaceSign(lm){
  if(!lm)return{ok:false,score:0};
  let cx=0,cy=0;
  for(const i of PR){cx+=lm[i].x;cy+=lm[i].y;}
  cx/=3;cy/=3;
  const ps=Math.hypot(lm[9].x-lm[0].x,lm[9].y-lm[0].y);
  const d8=Math.hypot(lm[8].x-cx,lm[8].y-cx)/ps;
  const d12=Math.hypot(lm[12].x-cx,lm[12].y-cy)/ps;
  const d16=Math.hypot(lm[16].x-cx,lm[16].y-cy)/ps;
  const d20=Math.hypot(lm[20].x-cx,lm[20].y-cy)/ps;
  return{ok:d8>.55&&d12>.55&&d16<.42&&d20<.38,score:Math.max(0,Math.min(1,(d8+d12-d16-d20)*.4))};
}
function analyzeHand(lm){
  if(!lm||lm.length<21){handData.detected=false;return;}
  handData.detected=true;handData.landmarks=lm;
  let cx=0,cy=0;
  for(const i of PR){cx+=lm[i].x;cy+=lm[i].y;}
  cx/=3;cy/=3;
  handData.prevPalmX=handData.palmX;handData.prevPalmY=handData.palmY;
  handData.palmX=cx;handData.palmY=cy;
  const palmSize=Math.hypot(lm[9].x-lm[0].x,lm[9].y-lm[0].y);
  let sum=0;
  for(const i of FT)sum+=Math.hypot(lm[i].x-cx,lm[i].y-cy);
  handData.targetOpen=Math.max(0,Math.min(1,(sum/5/palmSize-.35)/.7));
  handData.velocity=Math.hypot(handData.palmX-handData.prevPalmX,handData.palmY-handData.prevPalmY);
  const p=isPeaceSign(lm);
  handData.isPeace=p.ok;
}

function drawHandWindow(){
  const w=handCanvas.width,h=handCanvas.height;
  handCtx.save();handCtx.scale(-1,1);handCtx.drawImage(videoEl,-w,0,w,h);handCtx.restore();
  if(!handData.detected||!handData.landmarks)return;
  const lm=handData.landmarks,pts=[];
  for(let i=0;i<21;i++)pts.push({x:lm[i].x*w,y:lm[i].y*h});
  handCtx.strokeStyle='rgba(255,60,100,.85)';handCtx.lineWidth=1.3;
  handCtx.shadowColor='rgba(255,60,100,.5)';handCtx.shadowBlur=5;
  handCtx.beginPath();
  for(const[a,b]of HC){handCtx.moveTo(pts[a].x);handCtx.lineTo(pts[b].x,pts[b].y);}
  handCtx.stroke();
  for(let i=0;i<21;i++){
    const p=pts[i],tip=FT.includes(i);
    handCtx.shadowBlur=tip?7:3;
    handCtx.fillStyle=tip?'rgba(255,220,100,.92)':'rgba(255,70,130,.85)';
    handCtx.beginPath();handCtx.arc(p.x,p.y,tip?3.6:2.2,0,Math.PI*2);handCtx.fill();
  }
  handCtx.shadowBlur=0;
}

/* ═══════ PHOTO ═══════ */
let photoCooldown=0;
function capturePhoto(){
  if(photoCooldown>0)return;
  photoCooldown=2.5;
  flash.classList.add('on');setTimeout(()=>flash.classList.remove('on'),150);
  photoStamp.classList.add('show');setTimeout(()=>photoStamp.classList.remove('show'),2000);
  const a=document.createElement('a');
  a.href=renderer.domElement.toDataURL('image/png');
  a.download='fingertip-bloom-'+Date.now()+'.png';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

/* ═══════ APP ═══════ */
const State={BUD:0,BLOOM:1,PEACE:2};
let appState=State.BUD,stateTimer=0,peaceHold=0,bloomLocked=false;
const rose=new Rose();scene.add(rose.getObj());
let smooth=.12,lt=performance.now()/1000,hintO=1,trailRe=.93;

function mH(){return{x:(.5-handData.palmX)*4.5,y:(.5-handData.palmY)*3.2};}

function animate(ts){
  requestAnimationFrame(animate);
  const now=ts/1000,dt=Math.min(now-lt,.1);lt=now;
  if(photoCooldown>0)photoCooldown=Math.max(0,photoCooldown-dt);

  if(handData.detected){
    const sp=handData.targetOpen>smooth?5.5:8.5;
    smooth+=(handData.targetOpen-smooth)*Math.min(dt*sp,1);
    const isOpen=smooth>.75,isClosed=smooth<.16,peaceConfirmed=handData.isPeace&&isPeaceSign(handData.landmarks).score>.5;
    stateTimer+=dt;
    switch(appState){
      case State.BUD:
        hintLine.classList.remove('prompt');
        if(isOpen&&stateTimer>1.){appState=State.BLOOM;stateTimer=0;bloomLocked=false;}
        break;
      case State.BLOOM:
        if(isOpen&&!bloomLocked&&stateTimer>.8)hintLine.classList.add('prompt');
        if(isClosed&&stateTimer>.2){appState=State.BUD;stateTimer=0;hintLine.classList.remove('prompt');break;}
        if(peaceConfirmed){peaceHold+=dt;if(peaceHold>.45){capturePhoto();appState=State.PEACE;stateTimer=0;peaceHold=0;hintLine.classList.remove('prompt');bloomLocked=true;}}else peaceHold=Math.max(0,peaceHold-dt);
        break;
      case State.PEACE:
        if(isClosed&&stateTimer>.3){appState=State.BUD;stateTimer=0;hintLine.classList.remove('prompt');bloomLocked=false;}
        else if(stateTimer>3.&&!peaceConfirmed){appState=State.BLOOM;stateTimer=0;bloomLocked=false;peaceHold=0;}
        break;
    }
  }else{
    smooth+=(.2-smooth)*Math.min(dt*1.2,1);stateTimer+=dt;
    if(stateTimer>2){appState=State.BUD;stateTimer=0;hintLine.classList.remove('prompt');bloomLocked=false;}
  }
  smooth=Math.max(0,Math.min(1,smooth));

  const h3=mH(),hv=handData.detected?handData.velocity:0;
  rose.update(smooth,h3,hv,dt,now);
  stem.update(smooth);
  updateMeteors(dt,now,hv,h3);
  twMat.uniforms.uTime.value=now;

  trailRe+=((.95-Math.min(hv*2.5,.07))-trailRe)*Math.min(dt*4,1);
  renderer.setRenderTarget(tWB);renderer.autoClear=true;
  trM.uniforms.tPrev.value=tRA.texture;trM.uniforms.uRet.value=trailRe;
  renderer.render(trS,trC);
  renderer.autoClear=false;renderer.clearDepth();
  scene.background=null;renderer.render(scene,camera);
  scene.background=new THREE.Color('#010116');
  renderer.setRenderTarget(null);renderer.autoClear=true;
  cpMat.map=tWB.texture;renderer.render(cpS,trC);
  [tRA,tWB]=[tWB,tRA];

  const pct=Math.round(smooth*100);
  opennessPct.textContent='舒展度 '+pct+'%';
  const ic=opennessCard.querySelector('.icon-hand');
  if(smooth<.16){ic.textContent='✊';opennessCard.classList.remove('blooming');topTag.classList.remove('blooming');topTag.innerHTML='<div class="red-dot"></div>握拳·闭合';}
  else if(smooth>.75){ic.textContent='✋';opennessCard.classList.add('blooming');topTag.classList.add('blooming');topTag.innerHTML='<div class="red-dot"></div>手掌舒展·绽放';}
  else{ic.textContent='🤏';topTag.classList.remove('blooming');topTag.innerHTML='<div class="red-dot"></div>手掌舒展·半开';}
  const act=rose.activeLayers(smooth);
  for(let i=0;i<layerDots.length;i++)layerDots[i].classList.toggle('on',!!act[i]);
  hintLine.textContent=appState===State.BLOOM&&stateTimer>.8?'比个 ✌  ·  拍照打卡':'握拳 → 花苞  ·  张开手掌 → 绽放  ·  比✌ → 拍照打卡';
  if(handData.detected&&hintO>0)hintO=Math.max(0,hintO-.005);
  if(!handData.detected&&hintO<1)hintO=Math.min(1,hintO+.004);
  hintLine.style.opacity=hintO;
  drawHandWindow();
  camera.position.x+=(Math.sin(now*.2)*.05-h3.x*.02-camera.position.x)*.015;
  camera.position.y+=(Math.cos(now*.18)*.04-h3.y*.02-camera.position.y)*.015;
  camera.lookAt(0,0,0);
}

async function initMP(){
  try{
    const hands=new Hands({locateFile:f=>`https://cdn.npmmirror.com/packages/@mediapipe/hands/0.4.1675469240/files/${f}`});
    hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.7,minTrackingConfidence:.5});
    hands.onResults(r=>{
      if(r.multiHandLandmarks&&r.multiHandLandmarks.length>0)analyzeHand(r.multiHandLandmarks[0]);
      else handData.detected=false;
    });
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
    videoEl.srcObject=stream;await videoEl.play();
    new Camera(videoEl,{onFrame:async()=>{await hands.send({image:videoEl});},width:640,height:480}).start();
  }catch(e){console.error(e);handData.detected=false;}
}
async function main(){await initMP();requestAnimationFrame(animate);}
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);resizeRTs();});
main();
</script>
