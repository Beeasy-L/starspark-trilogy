<style>
:root{--gold:#f6dc9b;--gold2:#f2c66d;--ink:#0a0f1e}
.checkin{max-width:760px;margin:0 auto;padding:0 18px 60px;text-align:center}

.checkin-hero p{color:var(--muted);font-size:14px;line-height:2;max-width:560px;margin:0 auto}
.stage{position:relative;max-width:560px;margin:26px auto 0;border:1px solid rgba(242,198,109,.28);border-radius:18px;overflow:hidden;background:#04060f;aspect-ratio:4/3}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.stage canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
.stage .hint{position:absolute;left:0;right:0;bottom:14px;padding:8px 14px;font-size:13px;color:#fff;background:rgba(4,6,15,.55);border-radius:999px;display:inline-block;width:fit-content;margin:0 auto;letter-spacing:.06em}
.stage .hint.hit{color:#0a0f1e;background:linear-gradient(120deg,#f6dc9b,#ffb35c);font-weight:600}
.stage .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:13px;background:#04060f}
.stage .loading .sp{width:34px;height:34px;border-radius:50%;border:2px solid rgba(242,198,109,.25);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ctrls{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:999px;font-size:14px;letter-spacing:.05em;cursor:pointer;border:1px solid rgba(242,198,109,.4);color:var(--gold);background:rgba(242,198,109,.08);transition:.2s}
.btn:hover{background:rgba(242,198,109,.18)}
.btn.primary{background:linear-gradient(120deg,#f6dc9b,#f2a95c);color:#0a0f1e;font-weight:600;border:none}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.manual-note{font-size:12px;color:var(--muted);margin-top:12px;opacity:.8}
.card-wrap{margin:30px auto 0;max-width:600px}
.card-wrap .card{width:100%;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid rgba(242,198,109,.25)}
.card-wrap img{width:100%;display:block}
.card-actions{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.privacy{font-size:12px;color:var(--muted);opacity:.75;margin-top:26px;line-height:1.9}
.count-line{font-size:13px;color:var(--gold2);margin-top:14px;letter-spacing:.04em}
</style>

<body data-page="detail" data-bgm-src='[{"src":"../assets/xiaoxingxing.mp3","label":"小星星","volume":0.0830},{"src":"../assets/moon.mp3","label":"月亮代表我的心","volume":0.1493}]'>

  </main>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), cam = $("cam"), fx = $("fx"), fctx = fx.getContext("2d");
  var loading = $("loading"), loadText = $("load-text");
  var hint = $("hint"), startBtn = $("start-btn"), snapBtn = $("snap-btn");
  var cardWrap = $("card-wrap"), cardImg = $("card-img"), countLine = $("count-line"), dlBtn = $("dl-btn"), againBtn = $("again-btn");

  var KEY = "starfire-checkin-count";
  var count = parseInt(localStorage.getItem(KEY) || "0", 10);

  var stream = null, landmarker = null, running = false;
  var bloomFrames = 0, fired = false;

  // 3D 粒子花状态
  var FLOWER = { x: 0, y: 0, spread: 0, spin: 0, burst: 0 };
  var flowerParts = [];
  var glowSprites = [];

  function setHint(txt, hit){
    hint.hidden = false;
    hint.textContent = txt;
    hint.classList.toggle("hit", !!hit);
  }
  function hideHint(){ hint.hidden = true; }

  // 镜像坐标（与预览一致：视频与画布都 scaleX(-1)）
  function flipLandmarks(lm){
    var out = [];
    for(var i = 0; i < lm.length; i++) out.push({ x: 1 - lm[i].x, y: lm[i].y });
    return out;
  }

  // 食指(8)+中指(12)张合度 → 0~1（并拢≈0，张开≈1）
  function fingerGap(lm){
    if(!lm) return 0;
    var dx = lm[8].x - lm[12].x, dy = lm[8].y - lm[12].y;
    var d = Math.sqrt(dx * dx + dy * dy);
    return Math.max(0, Math.min(1, (d - 0.025) / 0.10));
  }

  // ---------- 指尖光束花 ----------
  function makeGlow(rgb){
    var s = document.createElement("canvas");
    s.width = s.height = 64;
    var g = s.getContext("2d");
    var grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, "rgba(" + rgb + ",1)");
    grd.addColorStop(0.35, "rgba(" + rgb + ",.55)");
    grd.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    return s;
  }

  function initFlower(){
    glowSprites = [
      makeGlow("255,214,140"),  // 0 金
      makeGlow("255,168,96"),   // 1 橙
      makeGlow("255,140,200"),  // 2 粉
      makeGlow("255,255,255")   // 3 白
    ];
    flowerParts.length = 0;
    burstParts.length = 0;
    var i;
    // 花瓣光束：32 根，长短交错（每 4 根一根长瓣）
    for(i = 0; i < 32; i++){
      flowerParts.push({
        k: "p",
        phi: (i / 32) * Math.PI * 2,
        th0: (i % 4 === 0) ? 0.38 : 0.55,
        len: (i % 4 === 0) ? 1.5 : 1.02,
        w: (i % 4 === 0) ? 5.0 : 3.2,
        hue: i % 5 === 0 ? 2 : (i % 3 === 0 ? 1 : 0),
        ph: Math.random() * Math.PI * 2
      });
    }
    // 内层短光束：12 根，更亮更细
    for(i = 0; i < 12; i++){
      flowerParts.push({
        k: "p2",
        phi: (i / 12) * Math.PI * 2 + Math.PI / 12,
        th0: 0.30,
        len: 0.55,
        w: 2.4,
        hue: 0,
        ph: Math.random() * Math.PI * 2
      });
    }
    // 环绕光尘
    for(i = 0; i < 24; i++){
      flowerParts.push({ k: "d", phi: Math.random() * Math.PI * 2, th0: 1.0, ph: Math.random() * Math.PI * 2, sz: 1.4 + Math.random() * 2.2, img: 3 });
    }
  }

  // 绽放喷发粒子
  var burstParts = [];
  function spawnBurst(W, H){
    var R = Math.min(W, H) * 0.40;
    for(var i = 0; i < 40; i++){
      var ang = Math.random() * Math.PI * 2;
      burstParts.push({
        ang: ang,
        vx: Math.cos(ang), vy: Math.sin(ang),
        sp: (0.8 + Math.random() * 2.2) * R,
        life: 1, decay: 0.028 + Math.random() * 0.03,
        hue: Math.random() < 0.5 ? 0 : (Math.random() < 0.5 ? 1 : 2),
        sz: 1.6 + Math.random() * 2.6
      });
    }
  }
  function stepBurst(){
    for(var i = burstParts.length - 1; i >= 0; i--){
      var b = burstParts[i];
      b.life -= b.decay;
      if(b.life <= 0){ burstParts.splice(i, 1); continue; }
      var dist = b.sp * (1 - b.life) * 1.6;
      var bx = FLOWER.x + b.vx * dist;
      var by = FLOWER.y + b.vy * dist * 0.85 - (1 - b.life) * 70;
      drawGlow(glowSprites[b.hue], bx, by, b.sz * (1 + (1 - b.life) * 2), b.life * 0.9);
    }
  }

  function drawGlow(img, x, y, size, alpha){
    if(alpha <= 0.01) return;
    fctx.globalAlpha = alpha;
    var s = size * 5;
    fctx.drawImage(img, x - s / 2, y - s / 2, s, s);
  }

  function renderFlower(W, H){
    var cx = FLOWER.x, cy = FLOWER.y;
    var s = FLOWER.spread;
    var R = Math.min(W, H) * 0.40;
    var t = FLOWER.spin;
    FLOWER.spin += 0.016 + s * 0.030;
    var spin = FLOWER.spin;
    if(FLOWER.burst > 0){ spawnBurst(W, H); FLOWER.burst = 0; }
    stepBurst();

    // 花心亮核（随开放度变亮）
    var coreR = R * (0.10 + 0.10 * s);
    var g0 = fctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 4);
    g0.addColorStop(0, "rgba(255,246,214," + (0.35 + 0.5 * s).toFixed(3) + ")");
    g0.addColorStop(1, "rgba(255,214,140,0)");
    fctx.fillStyle = g0;
    fctx.beginPath(); fctx.arc(cx, cy, coreR * 4, 0, Math.PI * 2); fctx.fill();
    fctx.fillStyle = "rgba(255,252,235,.98)";
    fctx.beginPath(); fctx.arc(cx, cy, coreR * 0.5, 0, Math.PI * 2); fctx.fill();

    // 光束花瓣：闭合=竖直聚拢成花苞，张开=水平放射成莲花并旋转
    for(var i = 0; i < flowerParts.length; i++){
      var p = flowerParts[i];
      var ph = p.ph + spin * 2;
      if(p.k === "d"){
        var dr = R * (0.8 + s * 1.8) + Math.sin(spin * 2 + ph) * R * 0.16;
        var dx = cx + Math.cos(p.phi + spin * 0.7) * dr;
        var dy = cy + Math.sin(p.phi + spin * 0.7) * dr * 0.72;
        var tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(spin * 3 + p.ph));
        drawGlow(glowSprites[3], dx, dy, p.sz * (1 + s * 0.6), tw);
        continue;
      }
      // 球坐标：th 从花苞仰角 → 平铺（s=0 竖直聚拢，s=1 水平放射）
      var th = p.th0 * (1 - s) + 1.47 * s;
      var breathe = 1 + 0.07 * Math.sin(t * 3 + p.ph);
      var L = R * p.len * breathe;
      // 水平展开随 s，竖直高度随 (1-s)
      var hx = Math.cos(p.phi + spin) * Math.sin(th) * L * (0.35 + 0.65 * s);
      var hy = Math.sin(p.phi + spin) * Math.sin(th) * L * (0.35 + 0.65 * s);
      var vz = Math.cos(th) * L * (0.3 + 0.7 * (1 - s));
      var ex = cx + hx;
      var ey = cy + hy * 0.92 - vz;
      // 光束渐变：花心亮 → 彩 → 透明
      var cols = p.hue === 2 ? "255,140,200" : (p.hue === 1 ? "255,168,96" : "255,206,120");
      var g = fctx.createLinearGradient(cx, cy, ex, ey);
      g.addColorStop(0, "rgba(255,250,228,.96)");
      g.addColorStop(0.32, "rgba(255,232,170,.86)");
      g.addColorStop(0.72, "rgba(" + cols + ",.66)");
      g.addColorStop(1, "rgba(" + cols + ",0)");
      fctx.strokeStyle = g;
      fctx.lineWidth = p.w * (0.7 + s * 0.55);
      fctx.lineCap = "round";
      fctx.beginPath();
      fctx.moveTo(cx + (ex - cx) * 0.1, cy + (ey - cy) * 0.1);
      fctx.lineTo(ex, ey);
      fctx.stroke();
    }
    fctx.globalAlpha = 1;
  }

  // ---------- 打卡图合成 ----------
  function composeCard(){
    var W = 1200, H = 630;
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var c = cv.getContext("2d");

    // 背景：深蓝星空渐变
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b1026");
    g.addColorStop(0.55, "#0a0f1e");
    g.addColorStop(1, "#141a38");
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    // 星点
    var seed = 12345;
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for(var i = 0; i < 160; i++){
      var sx = rnd() * W, sy = rnd() * H, sr = 0.6 + rnd() * 1.6;
      c.globalAlpha = 0.25 + rnd() * 0.55;
      c.fillStyle = rnd() < 0.18 ? "#f2c66d" : "#dce4f5";
      c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;

    // 左侧照片：取当前摄像头画面，裁成竖版放左区；无画面时画占位星夜
    var pad = 26, pw = 430, ph = H - pad * 2;
    var shot = document.createElement("canvas");
    var sw = cam.videoWidth || 0, sh = cam.videoHeight || 0;
    shot.width = sw || 640; shot.height = sh || 480;
    var sc = shot.getContext("2d");
    var hasFrame = sw > 0 && cam.readyState >= 2;
    if(hasFrame){
      sc.translate(shot.width, 0); sc.scale(-1, 1);  // 镜像，与预览一致
      sc.drawImage(cam, 0, 0, shot.width, shot.height);
    } else {
      var bg = sc.createLinearGradient(0, 0, 0, shot.height);
      bg.addColorStop(0, "#0b1026"); bg.addColorStop(1, "#141a38");
      sc.fillStyle = bg; sc.fillRect(0, 0, shot.width, shot.height);
      sc.fillStyle = "rgba(246,220,155,.8)";
      sc.font = 'bold 64px "STZhongsong","Songti SC","SimSun",serif';
      sc.textAlign = "center";
      sc.fillText("星火", shot.width / 2, shot.height / 2);
    }
    c.save();
    c.beginPath();
    c.roundRect(pad, pad, pw, ph, 16);
    c.clip();
    if(hasFrame){
      // 裁中心竖版区域
      var cropH = sw * (ph / pw) > sh ? sh : sw * (ph / pw);
      var cropY = (sh - cropH) / 2;
      c.drawImage(shot, 0, cropY, sw, cropH, pad, pad, pw, ph);
    } else {
      c.drawImage(shot, 0, 0, shot.width, shot.height, pad, pad, pw, ph);
    }
    c.restore();
    c.strokeStyle = "rgba(246,220,155,.55)";
    c.lineWidth = 2;
    c.beginPath(); c.roundRect(pad, pad, pw, ph, 16); c.stroke();

    // 右侧文字
    var x0 = pad + pw + 40, tw = W - x0 - 40;
    c.fillStyle = "#f6dc9b";
    c.font = 'bold 58px "STZhongsong","Songti SC","SimSun",serif';
    c.textAlign = "left"; c.textBaseline = "alphabetic";
    c.fillText("星火三部曲", x0, 170);
    // 细金线
    c.strokeStyle = "rgba(242,198,109,.55)";
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(x0, 198); c.lineTo(x0 + tw * 0.55, 198); c.stroke();
    c.fillStyle = "#e8d9ae";
    c.font = '30px "STZhongsong","Songti SC","SimSun",serif';
    c.fillText("心栖明月长明", x0, 252);

    // 日期与第 N 次
    c.fillStyle = "rgba(232,217,174,.85)";
    c.font = '20px "STZhongsong","Songti SC","SimSun",serif';
    var now = new Date();
    var pad2 = function(n){ return (n < 10 ? "0" : "") + n; };
    var dateStr = now.getFullYear() + "." + pad2(now.getMonth() + 1) + "." + pad2(now.getDate());
    c.fillText(dateStr + " · 第 " + count + " 次星火打卡", x0, 320);

    // 底部小字
    c.fillStyle = "rgba(220,228,245,.6)";
    c.font = '16px "STZhongsong","Songti SC","SimSun",serif';
    c.fillText("Starfire Series · 2026 · Made with moonlight", x0, H - 60);

    return cv.toDataURL("image/png");
  }

  function showCard(dataUrl){
    cardImg.src = dataUrl;
    dlBtn.href = dataUrl;
    cardWrap.hidden = false;
    countLine.textContent = "这是你第 " + count + " 次点亮星火";
    cardWrap.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function fireCheckin(){
    setHint("花开啦 ✌", true);
    setTimeout(function(){
      count++;
      localStorage.setItem(KEY, String(count));
      var dataUrl = composeCard();
      showCard(dataUrl);
      running = false;
      stopCam();
      hideHint();
    }, 1100);
  }

  // ---------- 手势检测循环 ----------
  var lastLandmarks = null, rafId = null, frameSkip = 0;
  function loop(ts){
    if(!running) return;
    rafId = requestAnimationFrame(loop);
    if(frameSkip % 3 !== 0){ frameSkip++; return; }
    frameSkip++;
    if(!landmarker || cam.readyState < 2) return;
    var res;
    try { res = landmarker.detectForVideo(cam, performance.now()); }
    catch(e){ return; }
    fctx.clearRect(0, 0, fx.width, fx.height);
    var lm = null;
    if(res && res.landmarks && res.landmarks.length > 0){
      lastLandmarks = res.landmarks[0];
      lm = flipLandmarks(lastLandmarks);
    }
    if(lm){
      var gap = fingerGap(lm);
      FLOWER.spread += (gap - FLOWER.spread) * 0.22;
      var W = fx.width, H = fx.height;
      FLOWER.x += (((lm[8].x + lm[12].x) / 2) * W - FLOWER.x) * 0.28;
      FLOWER.y += (((lm[8].y + lm[12].y) / 2) * H - FLOWER.y) * 0.28;
      if(FLOWER.spread > 0.88){
        bloomFrames++;
        if(bloomFrames > 46 && !fired){
          fired = true;
          FLOWER.burst = 1;
          fireCheckin();
        } else if(!fired){
          setHint("要开了…两指再张开一点");
        }
      } else {
        bloomFrames = 0;
        setHint("两指张开，花开；并拢，花合");
      }
    } else {
      bloomFrames = 0;
      FLOWER.spread *= 0.97;
      setHint("食指和中指张开一点，让花醒来");
    }
    renderFlower(fx.width, fx.height);
  }

  function startCam(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      loadText.textContent = "当前浏览器不支持摄像头";
      return;
    }
    loadText.textContent = "正在请求摄像头，请在弹窗里点「允许」…";
    var pending = true;
    var guard = setTimeout(function(){
      if(pending){
        pending = false;
        loadText.textContent = "摄像头没有响应（用 file:// 本地打开时权限常被拦截）——点「直接拍照」也能打卡";
        snapBtn.disabled = false;
      }
    }, 8000);
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then(function(s){
        clearTimeout(guard);
        if(!pending) return s;
        pending = false;
        stream = s;
        cam.srcObject = s;
        loading.hidden = true;
        startBtn.disabled = true;
        snapBtn.disabled = false;
        setHint("正在加载手势模型…");
        return s;
      })
      .then(loadModel)
      .catch(function(err){
        clearTimeout(guard);
        pending = false;
        loadText.textContent = "摄像头被拒绝或不可用——点「直接拍照」也能打卡";
        snapBtn.disabled = false;
      });
  }

  // ---------- 手势模型（双源：抖音 CDN 模型脚本为主，GitHub raw 直链兜底；JS 库与 wasm 走 npmmirror） ----------
  var MP_JS = "https://cdn.npmmirror.com/packages/%40mediapipe%2ftasks-vision/0.10.14/files/vision_bundle.mjs";
  var MP_WASM = "https://cdn.npmmirror.com/packages/%40mediapipe%2ftasks-vision/0.10.14/files/wasm";
  var MP_MODEL_JS = "https://aka.doubaocdn.com/s/FVBGBjs3oy";
  var MP_MODEL_RAW = "https://raw.githubusercontent.com/IoT-gamer/hand_landmarker/main/android/src/main/assets/hand_landmarker.task";

  function modelBytes(){
    var b64 = window.__STARFIRE_MODEL_B64 || "";
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function loadModel(){
    loadText.textContent = "正在加载手势模型（首次约 8MB，请稍候）…";
    var done = false;
    var guard = setTimeout(function(){
      if(!done){
        loadText.textContent = "模型加载超时，请检查网络后刷新（或点「直接拍照」）";
        snapBtn.disabled = false;
      }
    }, 90000);

    var onOk = function(hl){
      clearTimeout(guard); done = true;
      landmarker = hl;
      fx.width = stage.clientWidth; fx.height = stage.clientHeight;
      running = true;
      bloomFrames = 0; fired = false;
      FLOWER.spread = 0; FLOWER.burst = 0; FLOWER.spin = 0;
      FLOWER.x = fx.width / 2; FLOWER.y = fx.height / 2;
      initFlower();
      setHint("张开食指和中指，让花醒来");
      requestAnimationFrame(loop);
    };
    var onErr = function(e){
      clearTimeout(guard); done = true;
      loadText.textContent = "模型加载失败，请检查网络后刷新（或点「直接拍照」）";
      snapBtn.disabled = false;
    };

    // 方式 B：npmmirror 库 + raw 直链模型（兜底）
    var startWithRaw = function(){
      import(MP_JS)
        .then(function(mod){
          return mod.FilesetResolver.forVisionTasks(MP_WASM).then(function(fileset){
            return mod.HandLandmarker.createFromOptions(fileset, {
              baseOptions: { modelAssetPath: MP_MODEL_RAW, delegate: "CPU" },
              runningMode: "VIDEO",
              numHands: 1
            });
          });
        })
        .then(onOk)
        .catch(onErr);
    };

    // 方式 A：doubaocdn 模型脚本 → base64 解码 → modelAssetBuffer
    var s = document.createElement("script");
    s.src = MP_MODEL_JS;   // 注意：不加 crossOrigin（no-cors 请求不带 Origin）
    s.onload = function(){
      if(window.__STARFIRE_MODEL_B64 && window.__STARFIRE_MODEL_B64.length > 1000){
        import(MP_JS)
          .then(function(mod){
            return mod.FilesetResolver.forVisionTasks(MP_WASM).then(function(fileset){
              return mod.HandLandmarker.createFromOptions(fileset, {
                baseOptions: { modelAssetBuffer: modelBytes(), delegate: "CPU" },
                runningMode: "VIDEO",
                numHands: 1
              });
            });
          })
          .then(onOk)
          .catch(onErr);
      } else {
        startWithRaw();
      }
    };
    s.onerror = function(){ startWithRaw(); };
    document.head.appendChild(s);
  }

  function stopCam(){
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    running = false;
    startBtn.disabled = false;
    snapBtn.disabled = true;
  }

  // 手动拍照兜底
  snapBtn.addEventListener("click", function(){
    if(cam.readyState >= 2 && running){
      count++;
      localStorage.setItem(KEY, String(count));
      var dataUrl = composeCard();
      showCard(dataUrl);
      stopCam();
    } else {
      // 摄像头没起来：生成无照片版打卡图
      count++;
      localStorage.setItem(KEY, String(count));
      var dataUrl = composeCard();
      showCard(dataUrl);
      stopCam();
    }
  });

  againBtn.addEventListener("click", function(){
    cardWrap.hidden = true;
    running = false;
    stopCam();
    fctx.clearRect(0, 0, fx.width, fx.height);
    loading.hidden = false;
    loadText.textContent = "点击「开始打卡」，重新开启摄像头";
    startCam();
  });

  startBtn.addEventListener("click", startCam);
  // 返回时清理摄像头
  window.addEventListener("beforeunload", function(){ stopCam(); });
})();
</script>
</body>
</html>
