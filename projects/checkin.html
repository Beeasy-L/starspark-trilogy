<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日星火打卡 · 星火三部曲</title>
  <meta name="description" content="对着镜头比个✌，让指尖开出一朵花。星火三部曲隐藏打卡彩蛋——打卡图可下载、可分享。">
  <meta name="author" content="Esty">
  <meta name="theme-color" content="#070b18">
  <link rel="canonical" href="https://beeasy-l.github.io/starspark-trilogy/projects/checkin.html">

  <link rel="stylesheet" href="../assets/site.css?v=20261028f">
  <script src="../assets/site.js?v=20261028d" defer></script>
<style>
:root{--gold:#f6dc9b;--gold2:#f2c66d;--ink:#0a0f1e}
.checkin{max-width:760px;margin:0 auto;padding:0 18px 60px;text-align:center}
.checkin-hero{margin:34px 0 10px}
.checkin-hero .k{font-size:12px;letter-spacing:.34em;color:var(--gold2);opacity:.75}
.checkin-hero h1{font-size:34px;margin:10px 0 12px;color:var(--gold);letter-spacing:.08em}
.checkin-hero p{color:var(--muted);font-size:14px;line-height:2;max-width:560px;margin:0 auto}
.stage{position:relative;max-width:560px;margin:26px auto 0;border:1px solid rgba(242,198,109,.28);border-radius:18px;overflow:hidden;background:#04060f;aspect-ratio:4/3}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.stage canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
.stage .hint{position:absolute;left:0;right:0;bottom:14px;padding:8px 14px;font-size:13px;color:#fff;background:rgba(4,6,15,.55);border-radius:999px;display:inline-block;width:fit-content;margin:0 auto;letter-spacing:.06em}
.stage .hint.hit{color:#0a0f1e;background:linear-gradient(120deg,#f6dc9b,#ffb35c);font-weight:600}
.stage .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:13px;background:#04060f}
.stage .loading .sp{width:34px;height:34px;border-radius:50%;border:2px solid rgba(242,198,109,.25);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ctrls{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:999px;font-size:14px;letter-spacing:.05em;cursor:pointer;border:1px solid rgba(242,198,109,.4);color:var(--gold);background:rgba(242,198,109,.08);transition:.2s}
.btn:hover{background:rgba(242,198,109,.18)}
.btn.primary{background:linear-gradient(120deg,#f6dc9b,#f2a95c);color:#0a0f1e;font-weight:600;border:none}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.manual-note{font-size:12px;color:var(--muted);margin-top:12px;opacity:.8}
.card-wrap{margin:30px auto 0;max-width:600px}
.card-wrap .card{width:100%;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid rgba(242,198,109,.25)}
.card-wrap img{width:100%;display:block}
.card-actions{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.privacy{font-size:12px;color:var(--muted);opacity:.75;margin-top:26px;line-height:1.9}
.count-line{font-size:13px;color:var(--gold2);margin-top:14px;letter-spacing:.04em}
</style>
</head>
<body data-page="detail" data-bgm-src='[{"src":"../assets/xiaoxingxing.mp3","label":"小星星","volume":0.0830},{"src":"../assets/moon.mp3","label":"月亮代表我的心","volume":0.1493}]'>
  <div class="starfield" id="starfield" aria-hidden="true">
    <div class="starfield__layer"></div>
    <div class="starfield__layer"></div>
    <div class="starfield__layer"></div>
  </div>

  <main class="wrap checkin">
    <a class="back-btn" href="../index.html">‹ 返回三部曲</a>

    <header class="checkin-hero">
      <div class="k">STARFIRE · HIDDEN CHECK-IN</div>
      <h1>今日星火打卡</h1>
      <p>对着镜头，比一个✌——让指尖开出一朵花。<br>花开的那一刻，就是今天的打卡完成：会生成一张属于你的星火打卡图，可以下载，也可以分享给想一起守星火的人。</p>
    </header>

    <div class="stage" id="stage">
      <div class="loading" id="loading">
        <div class="sp" aria-hidden="true"></div>
        <span id="load-text">正在准备摄像头…</span>
      </div>
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="fx" class="fx"></canvas>
      <div class="hint" id="hint" hidden>正在寻找你的手…</div>
    </div>

    <div class="ctrls">
      <button class="btn primary" id="start-btn" type="button">开始打卡</button>
      <button class="btn" id="snap-btn" type="button" disabled>直接拍照</button>
    </div>
    <div class="manual-note">手抖、光线暗、手势识别不了？点「直接拍照」一样打卡。摄像头画面只在本地处理，不会上传。</div>

    <div class="card-wrap" id="card-wrap" hidden>
      <h2 style="font-size:20px;color:var(--gold);letter-spacing:.1em;margin:0 0 14px">你的星火打卡图</h2>
      <div class="card"><img id="card-img" alt="星火打卡图"></div>
      <div class="count-line" id="count-line"></div>
      <div class="card-actions">
        <a class="btn primary" id="dl-btn" download="星火打卡.png" href="#">下载打卡图</a>
        <button class="btn" id="again-btn" type="button">再打一次</button>
      </div>
    </div>

    <p class="privacy">隐私说明：摄像头画面全程在你的浏览器本地处理，不经过任何服务器，打卡图也只存在你自己手里。</p>
  </main>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), cam = $("cam"), fx = $("fx"), fctx = fx.getContext("2d");
  var loading = $("loading"), loadText = $("load-text");
  var hint = $("hint"), startBtn = $("start-btn"), snapBtn = $("snap-btn");
  var cardWrap = $("card-wrap"), cardImg = $("card-img"), countLine = $("count-line"), dlBtn = $("dl-btn"), againBtn = $("again-btn");

  var KEY = "starfire-checkin-count";
  var count = parseInt(localStorage.getItem(KEY) || "0", 10);

  var stream = null, landmarker = null, running = false, victoryFrames = 0;
  var flowerFired = false, firingAt = 0;

  var VICTORY_FRAMES = 10;   // 连续 ~10 帧判定为✌
  var COOLDOWN_MS = 6000;    // 每次开花后 6 秒冷却，避免连续误触

  function setHint(txt, hit){
    hint.hidden = false;
    hint.textContent = txt;
    hint.classList.toggle("hit", !!hit);
  }
  function hideHint(){ hint.hidden = true; }

  function isVictory(landmarks){
    if(!landmarks) return false;
    // 归一化坐标（0~1，y 向下）：指尖在上=数字小
    var lm = landmarks;
    var tip8 = lm[8], tip12 = lm[12];        // 食、中指指尖
    var pip6 = lm[6], pip10 = lm[10];        // 食、中指第二关节
    var tip16 = lm[16], tip20 = lm[20];      // 无名指、小指指尖
    var pip14 = lm[14], pip18 = lm[18];      // 无名、小指第二关节
    // 食指、中指伸得够直：指尖明显高于第二关节
    var straight = (tip8.y < pip6.y - 0.03) && (tip12.y < pip10.y - 0.03);
    // 无名指、小指收着：指尖不低于第二关节太多
    var bentRing = (tip16.y > pip14.y + 0.01);
    var bentPinky = (tip20.y > pip18.y + 0.01);
    // 两指分开：8 与 12 的水平距离有一定间隔
    var apart = Math.abs(tip8.x - tip12.x) > 0.03;
    return straight && bentRing && bentPinky && apart;
  }

  // ---------- 指尖开花 ----------
  var petals = [];
  function spawnFlower(cx, cy, W, H){
    var n = 26, base = Math.min(W, H) * 0.16;
    for(var i = 0; i < n; i++){
      var ang = (i / n) * Math.PI * 2;
      var r0 = base * (0.25 + 0.5 * Math.random());
      petals.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * r0 * 0.06,
        vy: Math.sin(ang) * r0 * 0.06 - 0.7,
        life: 1, decay: 0.012 + 0.008 * Math.random(),
        hue: Math.random() < 0.6 ? 44 : (Math.random() < 0.5 ? 28 : 300)
      });
    }
  }
  function stepFlowers(){
    for(var i = petals.length - 1; i >= 0; i--){
      var p = petals[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= p.decay;
      if(p.life <= 0){ petals.splice(i, 1); }
    }
  }
  function drawFlowers(W, H){
    for(var i = 0; i < petals.length; i++){
      var p = petals[i];
      var a = Math.max(0, Math.min(1, p.life));
      fctx.globalAlpha = a;
      fctx.fillStyle = p.hue === 300 ? "hsl(300,80%,82%)" : (p.hue === 28 ? "hsl(28,95%,72%)" : "hsl(44,92%,78%)");
      var r = 2.6 + 3.2 * (1 - a);
      fctx.beginPath();
      fctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      fctx.fill();
      // 拖尾
      fctx.globalAlpha = a * 0.35;
      fctx.beginPath();
      fctx.arc(p.x - p.vx * 3, p.y - p.vy * 3, r * 0.6, 0, Math.PI * 2);
      fctx.fill();
    }
    fctx.globalAlpha = 1;
  }

  // ---------- 打卡图合成 ----------
  function composeCard(){
    var W = 1200, H = 630;
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var c = cv.getContext("2d");

    // 背景：深蓝星空渐变
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b1026");
    g.addColorStop(0.55, "#0a0f1e");
    g.addColorStop(1, "#141a38");
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    // 星点
    var seed = 12345;
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for(var i = 0; i < 160; i++){
      var sx = rnd() * W, sy = rnd() * H, sr = 0.6 + rnd() * 1.6;
      c.globalAlpha = 0.25 + rnd() * 0.55;
      c.fillStyle = rnd() < 0.18 ? "#f2c66d" : "#dce4f5";
      c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;

    // 左侧照片：取当前摄像头画面，裁成竖版放左区；无画面时画占位星夜
    var pad = 26, pw = 430, ph = H - pad * 2;
    var shot = document.createElement("canvas");
    var sw = cam.videoWidth || 0, sh = cam.videoHeight || 0;
    shot.width = sw || 640; shot.height = sh || 480;
    var sc = shot.getContext("2d");
    var hasFrame = sw > 0 && cam.readyState >= 2;
    if(hasFrame){
      sc.translate(shot.width, 0); sc.scale(-1, 1);  // 镜像，与预览一致
      sc.drawImage(cam, 0, 0, shot.width, shot.height);
    } else {
      var bg = sc.createLinearGradient(0, 0, 0, shot.height);
      bg.addColorStop(0, "#0b1026"); bg.addColorStop(1, "#141a38");
      sc.fillStyle = bg; sc.fillRect(0, 0, shot.width, shot.height);
      sc.fillStyle = "rgba(246,220,155,.8)";
      sc.font = 'bold 64px "STZhongsong","Songti SC","SimSun",serif';
      sc.textAlign = "center";
      sc.fillText("星火", shot.width / 2, shot.height / 2);
    }
    c.save();
    c.beginPath();
    c.roundRect(pad, pad, pw, ph, 16);
    c.clip();
    if(hasFrame){
      // 裁中心竖版区域
      var cropH = sw * (ph / pw) > sh ? sh : sw * (ph / pw);
      var cropY = (sh - cropH) / 2;
      c.drawImage(shot, 0, cropY, sw, cropH, pad, pad, pw, ph);
    } else {
      c.drawImage(shot, 0, 0, shot.width, shot.height, pad, pad, pw, ph);
    }
    c.restore();
    c.strokeStyle = "rgba(246,220,155,.55)";
    c.lineWidth = 2;
    c.beginPath(); c.roundRect(pad, pad, pw, ph, 16); c.stroke();

    // 右侧文字
    var x0 = pad + pw + 40, tw = W - x0 - 40;
    c.fillStyle = "#f6dc9b";
    c.font = 'bold 58px "STZhongsong","Songti SC","SimSun",serif';
    c.textAlign = "left"; c.textBaseline = "alphabetic";
    c.fillText("星火三部曲", x0, 170);
    // 细金线
    c.strokeStyle = "rgba(242,198,109,.55)";
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(x0, 198); c.lineTo(x0 + tw * 0.55, 198); c.stroke();
    c.fillStyle = "#e8d9ae";
    c.font = '30px "STZhongsong","Songti SC","SimSun",serif';
    c.fillText("心栖明月长明", x0, 252);

    // 日期与第 N 次
    c.fillStyle = "rgba(232,217,174,.85)";
    c.font = '20px "STZhongsong","Songti SC","SimSun",serif';
    var now = new Date();
    var pad2 = function(n){ return (n < 10 ? "0" : "") + n; };
    var dateStr = now.getFullYear() + "." + pad2(now.getMonth() + 1) + "." + pad2(now.getDate());
    c.fillText(dateStr + " · 第 " + count + " 次星火打卡", x0, 320);

    // 底部小字
    c.fillStyle = "rgba(220,228,245,.6)";
    c.font = '16px "STZhongsong","Songti SC","SimSun",serif';
    c.fillText("Starfire Series · 2026 · Made with moonlight", x0, H - 60);

    return cv.toDataURL("image/png");
  }

  function showCard(dataUrl){
    cardImg.src = dataUrl;
    dlBtn.href = dataUrl;
    cardWrap.hidden = false;
    countLine.textContent = "这是你第 " + count + " 次点亮星火";
    cardWrap.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function fireAndSnap(){
    if(!running) return;
    var rect = stage.getBoundingClientRect();
    var lms = lastLandmarks;
    var cx = rect.width / 2, cy = rect.height / 2;
    if(lms){
      cx = lms[8].x * rect.width + 8;
      cy = lms[8].y * rect.height - 20;
    }
    spawnFlower(cx, cy, rect.width, rect.height);
    setHint("花开啦 ✌", true);
    setTimeout(function(){
      count++;
      localStorage.setItem(KEY, String(count));
      var dataUrl = composeCard();
      showCard(dataUrl);
      running = false;
      stopCam();
      hideHint();
    }, 900);
  }

  // ---------- 手势检测循环 ----------
  var lastLandmarks = null, rafId = null, frameSkip = 0;
  function loop(ts){
    if(!running) return;
    rafId = requestAnimationFrame(loop);
    if(frameSkip % 3 !== 0){ frameSkip++; return; }
    frameSkip++;
    if(!landmarker || cam.readyState < 2) return;
    var res;
    try { res = landmarker.detectForVideo(cam, performance.now()); }
    catch(e){ return; }
    fctx.clearRect(0, 0, fx.width, fx.height);
    stepFlowers(); drawFlowers(fx.width, fx.height);
    var lm = null;
    if(res && res.landmarks && res.landmarks.length > 0){
      lm = res.landmarks[0];
      lastLandmarks = lm;
    }
    if(isVictory(lm)){
      victoryFrames++;
      if(victoryFrames >= VICTORY_FRAMES && !flowerFired && Date.now() - firingAt > COOLDOWN_MS){
        flowerFired = true; firingAt = Date.now();
        fireAndSnap();
      } else {
        setHint("检测到✌，稳住…");
      }
    } else {
      if(victoryFrames > 0) victoryFrames--;
      if(Date.now() - firingAt > COOLDOWN_MS){
        setHint("比一个✌试试");
      } else {
        setHint("休息一下，等下朵花");
      }
    }
  }

  function startCam(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      loadText.textContent = "当前浏览器不支持摄像头";
      return;
    }
    loadText.textContent = "正在请求摄像头…";
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then(function(s){
        stream = s;
        cam.srcObject = s;
        loading.hidden = true;
        startBtn.disabled = true;
        snapBtn.disabled = false;
        setHint("正在加载手势模型…");
        return s;
      })
      .then(loadModel)
      .catch(function(err){
        loadText.textContent = "摄像头被拒绝或不可用——点「直接拍照」也能打卡";
        snapBtn.disabled = false;
      });
  }

  function loadModel(){
    loadText.textContent = "正在加载手势模型（首次约 5MB，之后走缓存）…";
    var script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js";
    script.crossOrigin = "anonymous";
    script.onload = function(){
      var vision = window.FilesetResolver || (window.MediaPipeTasks && window.MediaPipeTasks.FilesetResolver);
      if(!vision){
        loadText.textContent = "模型加载失败，请刷新重试";
        return;
      }
      vision.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm")
        .then(function(fileset){
          var cls = window.HandLandmarker || (window.MediaPipeTasks && window.MediaPipeTasks.HandLandmarker);
          return cls.createFromOptions(fileset, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
              delegate: "CPU"
            },
            runningMode: "VIDEO",
            numHands: 1
          });
        })
        .then(function(hl){
          landmarker = hl;
          fx.width = stage.clientWidth; fx.height = stage.clientHeight;
          running = true;
          victoryFrames = 0; flowerFired = false; firingAt = 0;
          setHint("比一个✌试试");
          requestAnimationFrame(loop);
        })
        .catch(function(e){
          loadText.textContent = "模型加载失败，请刷新重试（或点直接拍照）";
        });
    };
    script.onerror = function(){
      loadText.textContent = "模型加载失败，请检查网络后刷新";
    };
    document.head.appendChild(script);
  }

  function stopCam(){
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    running = false;
    startBtn.disabled = false;
    snapBtn.disabled = true;
  }

  // 手动拍照兜底
  snapBtn.addEventListener("click", function(){
    if(cam.readyState >= 2 && running){
      count++;
      localStorage.setItem(KEY, String(count));
      var dataUrl = composeCard();
      showCard(dataUrl);
      stopCam();
    } else {
      // 摄像头没起来：生成无照片版打卡图
      count++;
      localStorage.setItem(KEY, String(count));
      var dataUrl = composeCard();
      showCard(dataUrl);
      stopCam();
    }
  });

  againBtn.addEventListener("click", function(){
    cardWrap.hidden = true;
    running = false;
    stopCam();
    fctx.clearRect(0, 0, fx.width, fx.height);
    loading.hidden = false;
    loadText.textContent = "正在准备摄像头…";
    startCam();
  });

  startBtn.addEventListener("click", startCam);
  // 返回时清理摄像头
  window.addEventListener("beforeunload", function(){ stopCam(); });
})();
</script>
</body>
</html>
