<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>星火三部曲 · 分享卡片</title>
  <link rel="stylesheet" href="site.css">
  <style>
    html,body{width:1200px;height:630px;overflow:hidden;background:#050914}
    body.share-page{
      position:relative;
      background:
        radial-gradient(540px 440px at 50% 43%,rgba(242,156,67,.3),transparent 67%),
        radial-gradient(760px 440px at 84% 0%,rgba(59,91,158,.24),transparent 65%),
        radial-gradient(620px 380px at 4% 104%,rgba(242,96,29,.16),transparent 70%),
        linear-gradient(145deg,#050914 0%,#0a1731 54%,#111622 100%);
    }
    body.share-page .starfield{
      opacity:.78;
      background:
        radial-gradient(circle at 50% 44%,rgba(255,225,164,.08),transparent 34%),
        linear-gradient(180deg,transparent 58%,rgba(5,9,20,.32));
    }
    .stage{
      position:relative;z-index:2;width:1200px;height:630px;
      overflow:hidden;text-align:center;
    }
    .stage::before{
      content:"";position:absolute;left:50%;top:47%;
      width:390px;height:390px;border-radius:50%;
      border:1px solid rgba(246,220,155,.15);
      transform:translate(-50%,-50%);
      box-shadow:
        0 0 0 76px rgba(246,220,155,.027),
        0 0 0 152px rgba(246,220,155,.016),
        0 0 110px rgba(242,156,67,.13);
    }
    .stage::after{
      content:"";position:absolute;left:50%;top:16%;
      width:2px;height:430px;transform:translateX(-50%);
      background:linear-gradient(180deg,transparent,rgba(246,220,155,.26),transparent);
      opacity:.4;
    }
    .brandline{
      position:absolute;z-index:3;left:50%;top:35px;
      display:flex;align-items:center;gap:12px;
      transform:translateX(-50%);
      color:#e6ad45;font-family:Consolas,monospace;
      font-size:12px;letter-spacing:.26em;white-space:nowrap;
    }
    .brandline::before,
    .brandline::after{
      content:"";width:48px;height:1px;
      background:linear-gradient(90deg,transparent,rgba(230,173,69,.72));
    }
    .brandline::after{transform:scaleX(-1)}
    .hero{
      position:absolute;z-index:3;left:50%;top:94px;
      width:650px;transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;
    }
    .emblem{
      width:66px;height:66px;border-radius:21px;
      border:1px solid rgba(246,220,155,.42);
      display:grid;place-items:center;
      background:linear-gradient(150deg,rgba(246,220,155,.2),rgba(242,96,29,.22));
      box-shadow:
        0 13px 38px rgba(242,96,29,.24),
        inset 0 1px rgba(255,255,255,.12);
    }
    .emblem svg{width:38px;height:38px}
    .eyebrow{
      margin-top:19px;color:#f2c76b;
      font-family:"SimSun",serif;font-size:16px;letter-spacing:.38em;
    }
    h1{
      margin-top:14px;font-family:"SimSun",serif;
      color:transparent;font-size:104px;line-height:1;font-weight:700;
      letter-spacing:.07em;text-indent:.07em;
      background:linear-gradient(180deg,#fff8db 4%,#f8e1a1 44%,#e4a53b 96%);
      -webkit-background-clip:text;background-clip:text;
      filter:drop-shadow(0 8px 25px rgba(244,186,75,.28));
    }
    .rule{
      display:flex;align-items:center;gap:16px;margin-top:19px;
      width:390px;color:#e6ad45;
    }
    .rule::before,.rule::after{
      content:"";flex:1;height:1px;
      background:linear-gradient(90deg,transparent,rgba(246,220,155,.52));
    }
    .rule::after{transform:scaleX(-1)}
    .rule i{font-style:normal;font-size:13px;filter:drop-shadow(0 0 7px rgba(246,220,155,.8))}
    .tagline{
      margin-top:18px;color:#f6e5b5;
      font-family:"SimSun",serif;font-size:31px;
      line-height:1.4;letter-spacing:.13em;
    }
    .constellation{
      position:relative;width:330px;height:54px;margin-top:25px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .constellation::before{
      content:"";position:absolute;left:16px;right:16px;top:50%;
      height:1px;transform:rotate(-3deg);
      background:linear-gradient(90deg,rgba(242,96,29,.15),rgba(246,220,155,.72),rgba(242,96,29,.15));
    }
    .node{
      position:relative;z-index:1;width:10px;height:10px;border-radius:50%;
      background:#fff8df;border:2px solid rgba(230,173,69,.75);
      box-shadow:0 0 15px rgba(246,220,155,.9);
    }
    .node:nth-child(2){
      width:15px;height:15px;background:#ffb66f;
      box-shadow:0 0 21px rgba(242,96,29,.9);
    }
    .node:nth-child(3){width:7px;height:7px;opacity:.72}
    .footer-mark{
      position:absolute;z-index:3;left:0;right:0;bottom:31px;
      color:#aebcda;font-family:Consolas,monospace;
      font-size:11px;letter-spacing:.24em;
    }
  </style>
</head>
<body class="share-page">
  <div class="starfield" id="starfield" aria-hidden="true">
    <div class="starfield__layer"></div>
    <div class="starfield__layer"></div>
    <div class="starfield__layer"></div>
  </div>

  <main class="stage">
    <div class="brandline">ESTY · STARFIRE SERIES</div>
    <section class="hero">
      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f6dc9b" stroke-width="1.45" stroke-linejoin="round">
          <path d="M19 13.2A7.5 7.5 0 1 1 10.8 5a6 6 0 0 0 8.2 8.2z" fill="rgba(246,220,155,.2)"/>
          <path d="M8.2 11.2l1.3 3.4 3.4 1.3-3.4 1.3-1.3 3.4-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#f2601d" stroke="none"/>
        </svg>
      </div>
      <div class="eyebrow">三 封 写 给 未 来 的 信</div>
      <h1>星火三部曲</h1>
      <div class="rule" aria-hidden="true"><i>✦</i></div>
      <p class="tagline">心栖明月长明—Esty</p>
      <div class="constellation" aria-hidden="true">
        <span class="node"></span>
        <span class="node"></span>
        <span class="node"></span>
      </div>
    </section>
    <div class="footer-mark">STARFIRE TRILOGY · 2026</div>
  </main>
  <script src="site.js"></script>
</body>
</html>
